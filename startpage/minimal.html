<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cggx — minimal</title>
<style>
:root {
  --bg:       #0a0a0c;
  --surface:  #151518;
  --panel:    #1a1a20;
  --red:      #ff2d55;
  --cyan:     #00e5ff;
  --lime:     #c8ff00;
  --orange:   #ff6b00;
  --purple:   #bd00ff;
  --pink:     #ff007f;
  --gold:     #ffcc00;
  --fg:       #e8e8f0;
  --muted:    #6a6a80;
  --border:   #2a2a35;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: "MonaspiceNe Nerd Font", "Share Tech Mono", "JetBrains Mono", monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
}

/* Clock */
.clock {
  font-size: 96px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1;
  margin-bottom: 4px;
}
.date {
  font-size: 18px;
  color: var(--muted);
  margin-bottom: 32px;
}

/* Greeting */
.greeting {
  font-size: 24px;
  color: var(--muted);
  margin-bottom: 16px;
}

/* Search bar */
.search-wrapper {
  width: 560px;
  max-width: 90vw;
}
.search-bar {
  width: 100%;
  padding: 14px 24px;
  background: var(--surface);
  border: 2px solid var(--border);
  color: var(--fg);
  font-size: 16px;
  font-family: inherit;
  outline: none;
  border-radius: 0;
  transition: border-color 0.2s ease;
}
.search-bar:focus {
  border-color: var(--red);
}
.search-bar::placeholder {
  color: var(--muted);
}

/* Quick links */
.quick-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 32px;
  max-width: 80vw;
}
.pill {
  padding: 10px 20px;
  font-weight: 700;
  font-family: inherit;
  font-size: 14px;
  text-decoration: none;
  border-radius: 0;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  cursor: pointer;
}
.pill:hover {
  transform: translateY(-2px);
}
.pill-red    { background: var(--red);    color: var(--bg); }
.pill-red:hover    { box-shadow: 0 4px 12px #ff2d5544; }
.pill-cyan   { background: var(--cyan);   color: var(--bg); }
.pill-cyan:hover   { box-shadow: 0 4px 12px #00e5ff44; }
.pill-lime   { background: var(--lime);   color: var(--bg); }
.pill-lime:hover   { box-shadow: 0 4px 12px #c8ff0044; }
.pill-orange { background: var(--orange); color: var(--bg); }
.pill-orange:hover { box-shadow: 0 4px 12px #ff6b0044; }
.pill-purple { background: var(--purple); color: var(--bg); }
.pill-purple:hover { box-shadow: 0 4px 12px #bd00ff44; }
.pill-pink   { background: var(--pink);   color: var(--bg); }
.pill-pink:hover   { box-shadow: 0 4px 12px #ff007f44; }
.pill-gold   { background: var(--gold);   color: var(--bg); }
.pill-gold:hover   { box-shadow: 0 4px 12px #ffcc0044; }
.pill-muted  { background: var(--muted);  color: var(--bg); }
.pill-muted:hover  { box-shadow: 0 4px 12px #6a6a8044; }

/* Bottom */
.bottom-text {
  margin-top: 48px;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="clock" id="clock"></div>
<div class="date" id="date"></div>

<div class="greeting" id="greeting"></div>

<div class="search-wrapper">
  <input class="search-bar" id="search" type="text" placeholder="Search the web&hellip;" autofocus>
</div>

<div class="quick-links">
  <a class="pill pill-red"    href="https://vivaldi.com">&#xf0ac; Vivaldi</a>
  <a class="pill pill-cyan"   href="https://github.com">&#xe62b; GitHub</a>
  <a class="pill pill-lime"   href="https://youtube.com">&#xf144; YouTube</a>
  <a class="pill pill-orange" href="https://soundcloud.com">&#xf001; Music</a>
  <a class="pill pill-purple" href="https://discord.com/app">&#xf086; Discord</a>
  <a class="pill pill-pink"   href="https://reddit.com">&#xf0e7; Reddit</a>
  <a class="pill pill-gold"   href="https://wiki.archlinux.org">&#xf0e7; Arch Wiki</a>
  <a class="pill pill-muted"  href="file:///home/nine/hyprarch">&#xf0e7; Dotfiles</a>
</div>

<div class="bottom-text">CGGX · hyprarch</div>

<script>
(function() {
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = h + ':' + m + ':' + s;
  }
  updateTime();
  setInterval(updateTime, 1000);

  function updateDate() {
    const now = new Date();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const day = days[now.getDay()];
    const date = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();
    document.getElementById('date').textContent = day + ', ' + date + ' ' + month + ' ' + year;
  }
  updateDate();

  function updateGreeting() {
    const h = new Date().getHours();
    let period = 'night';
    if (h >= 5 && h < 12) period = 'morning';
    else if (h >= 12 && h < 17) period = 'afternoon';
    else if (h >= 17 && h < 22) period = 'evening';
    document.getElementById('greeting').textContent = 'Good ' + period + ', nine.';
  }
  updateGreeting();

  const searchInput = document.getElementById('search');
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const query = searchInput.value.trim();
      if (query) {
        window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(query);
      }
    }
  });
})();
</script>
</body>
</html>
