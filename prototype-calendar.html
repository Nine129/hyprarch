<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGGX TimePanel — Final</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a0c;
  color:#e8e8f0;
  font-family:'JetBrainsMono Nerd Font','JetBrains Mono','Consolas',monospace;
  display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;overflow:hidden;
}
:root{
  --bg:#0a0a0c;--surface:#1a1a20;--border:#2a2a35;
  --red:#ff2d55;--cyan:#00e5ff;--lime:#c8ff00;--orange:#ff6b00;
  --silver:#e8e8f0;--muted:#6a6a80;
}
.screen{
  width:1920px;height:1080px;background:#0a0a0c;position:relative;
  display:flex;justify-content:center;align-items:flex-start;overflow:hidden;
}
.waybar{
  position:absolute;top:5px;left:12px;right:12px;height:36px;
  display:flex;align-items:center;pointer-events:none;z-index:1;
}
.waybar-pill{background:#1a1a20;padding:0 14px;height:28px;display:flex;align-items:center;gap:8px;pointer-events:auto;}
.waybar-pill.clock{background:#00e5ff;color:#0a0a0c;margin-left:auto;font-size:14px;}

.popup{
  position:absolute;top:47px;right:146px;width:303px;
  background:rgba(10,10,12,0.94);border:1px solid #2a2a35;
  z-index:10;overflow:visible;opacity:0;transition:opacity .2s ease;
}
.popup.show{opacity:1;}
.popup-inner{padding:18px 16px 16px;}

/* ── TIME title ── */
.time-title{
  text-align:center;font-size:16px;font-weight:700;
  letter-spacing:4px;color:var(--cyan);margin-bottom:10px;
}
/* ── Clock ── */
.clock-display{
  text-align:center;font-size:36px;font-weight:700;
  color:var(--silver);line-height:1.1;margin-bottom:6px;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
}
/* ── TZ carousel ── */
.tz-carousel{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:26px;margin-bottom:14px;position:relative;overflow:hidden;
}
.tz-carousel .slot{
  display:flex;align-items:center;justify-content:center;
  flex:1;cursor:pointer;user-select:none;
  font-size:10px;font-weight:500;
  transition:color .12s;line-height:1;
}
.tz-carousel .slot:hover{color:var(--silver) !important;}
/* ── Month nav ── */
.nav-row{
  display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;height:20px;
}
.nav-arrow{
  font-size:14px;color:var(--muted);cursor:pointer;width:18px;text-align:center;user-select:none;transition:color .1s;
}
.nav-arrow:hover{color:var(--cyan);}
.nav-month{
  font-size:9px;font-weight:700;color:var(--silver);letter-spacing:2px;min-width:80px;text-align:center;
}
/* ── Day headers ── */
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px;}
.dow-row span{text-align:center;font-size:8px;font-weight:700;color:var(--muted);padding:2px 0;}
/* ── Calendar grid ── */
.grid{display:grid;grid-template-columns:repeat(7,1fr);}
.grid .cell{
  text-align:center;font-size:11px;font-weight:500;padding:2px 0;cursor:default;color:var(--silver);
}
.grid .cell.off{color:var(--border);}
.grid .cell.today{color:var(--cyan);font-weight:700;font-size:12px;}
.grid .cell:hover{background:rgba(255,255,255,0.04);}
</style>
</head>
<body>
<div class="screen">
  <div class="waybar"><div class="waybar-pill clock"> Fri 06 08:30</div></div>
  <div class="popup show" id="popup"></div>
</div>
<script>
const now = new Date();
const year = now.getFullYear();
const month = now.getMonth();
const monthNames = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
const dowShort = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const timezones = [
  { name: 'Local',  offset: -new Date().getTimezoneOffset() / 60 },
  { name: 'HST',  offset: -10 },
  { name: 'AKT',  offset: -9 },
  { name: 'PT',   offset: -8 },
  { name: 'MT',   offset: -7 },
  { name: 'CT',   offset: -6 },
  { name: 'ET',   offset: -5 },
  { name: 'BRT',  offset: -3 },
  { name: 'UTC',  offset: 0 },
  { name: 'GMT',  offset: 0 },
  { name: 'CET',  offset: 1 },
  { name: 'MSK',  offset: 3 },
  { name: 'IST',  offset: 5.5 },
  { name: 'CST',  offset: 8 },
  { name: 'JST',  offset: 9 },
  { name: 'AET',  offset: 10 },
  { name: 'NZT',  offset: 12 },
];
let tzIndex = 0;

function getTimeInTZ(tzOff) {
  const d = new Date();
  return new Date(d.getTime() + (tzOff + d.getTimezoneOffset()/60) * 3600000);
}

function formatTime(d) {
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
}

function buildCalendar(y, m, tzOff) {
  const nowTZ = getTimeInTZ(tzOff);
  const td = nowTZ.getDate(), tm = nowTZ.getMonth(), ty = nowTZ.getFullYear();
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  const days = last.getDate(), start = (first.getDay() + 6) % 7;
  const prevLast = new Date(y, m, 0).getDate();
  const cells = [];
  for (let i = start - 1; i >= 0; i--) cells.push({ day: prevLast - i, cur: false });
  for (let d = 1; d <= days; d++) cells.push({ day: d, cur: true, today: d === td && m === tm && y === ty });
  let n = 1;
  while (cells.length < 42) cells.push({ day: n++, cur: false });
  return cells;
}

const popup = document.getElementById('popup');
let tzTimer = null;

function buildTZCarousel(centerIdx, tzs) {
  const total = tzs.length;
  const visible = [];
  for (let offset = -3; offset <= 3; offset++) {
    const idx = ((centerIdx + offset) % total + total) % total;
    visible.push({ name: tzs[idx].name, idx, dist: Math.abs(offset) });
  }
  return visible.map(it => {
    let style;
    if (it.dist === 0)      style = 'color:var(--cyan);font-weight:700';
    else if (it.dist === 1) style = 'color:var(--silver);font-weight:400';
    else if (it.dist === 2) style = 'color:var(--muted);font-weight:400';
    else                    style = 'color:#2a2a35;font-weight:400';
    return `<span class="slot" style="${style}" data-tz-idx="${it.idx}">${it.name}</span>`;
  }).join('');
}

function render() {
  const tzInfo = timezones[tzIndex];
  const cells = buildCalendar(year, month, tzInfo.offset);
  const nowTZ = getTimeInTZ(tzInfo.offset);
  const timeStr = formatTime(nowTZ);
  const tzCarousel = `<div class="tz-carousel">${buildTZCarousel(tzIndex, timezones)}</div>`;
  const navArrows = `<span class="nav-arrow">◂</span><span class="nav-month">${monthNames[month]} ${year}</span><span class="nav-arrow">▸</span>`;
  const dayRow = `<div class="dow-row">${dowShort.map(d => `<span>${d}</span>`).join('')}</div>`;
  const grid = `<div class="grid">${cells.map(c =>
    `<span class="cell${!c.cur?' off':''}${c.today?' today':''}">${c.day}</span>`
  ).join('')}</div>`;

  popup.innerHTML = `<div class="popup-inner">
    <div class="time-title">TIME</div>
    <div class="clock-display">${timeStr}</div>
    ${tzCarousel}
    <div class="nav-row">${navArrows}</div>
    ${dayRow}${grid}
  </div>`;
  popup.className = 'popup show';

  popup.querySelectorAll('[data-tz-idx]').forEach(el => {
    el.addEventListener('click', (e) => {
      const idx = parseInt(el.dataset.tzIdx);
      if (idx !== tzIndex) { tzIndex = idx; render(); tick(); }
    });
  });
  tick();
}

function tick() {
  if (tzTimer) clearTimeout(tzTimer);
  const nowTZ = getTimeInTZ(timezones[tzIndex].offset);
  const els = popup.querySelectorAll('.clock-display');
  els.forEach(el => el.textContent = formatTime(nowTZ));
  tzTimer = setTimeout(tick, 1000);
}

render();
</script>
</body>
</html>
