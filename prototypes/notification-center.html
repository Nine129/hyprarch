<!DOCTYPE html>
<!--
PROTOTYPE — throwaway
Question: "What should the right-sidebar notification + media center look like?"
Single design: colorful, whimsical, no borders, no boxes, multi-color.
Palette: orange #ff6b00, red #ff2d55, cyan #00e5ff, lime #c8ff00
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notif Center — Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0a0a0c;
    --bg-soft: #111114;
    --orange: #ff6b00;
    --red:    #ff2d55;
    --cyan:   #00e5ff;
    --lime:   #c8ff00;
    --silver: #e8e8f0;
    --muted:  #6a6a80;
    --dim:    #3a3a48;
    --font:   'JetBrains Mono', 'JetBrainsMono Nerd Font', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--silver);
    font-family: var(--font);
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .desktop {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, #1a1a2e 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, #2e1a2a 0%, transparent 40%),
      #0a0a0c;
    opacity: 0.5;
  }

  .notif-center {
    position: absolute;
    top: 12px; right: 12px; bottom: 12px;
    width: 380px;
    background: var(--bg);
    z-index: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--orange); }

  /* Header */
  .header {
    padding: 20px 20px 14px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .header .title {
    font-size: 22px; font-weight: 800; color: var(--cyan);
  }
  .header .count {
    color: var(--orange); font-size: 14px; font-weight: 700;
  }
  .header .actions button {
    background: none; border: none; cursor: pointer;
    color: var(--lime); font-family: var(--font);
    font-size: 12px; font-weight: 700;
  }
  .header .actions .danger { color: var(--red); }
  .header .actions button:hover { opacity: 0.7; }

  /* Now Playing */
  .np {
    margin: 8px 20px 18px;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
  }
  .np-art {
    width: 130px; height: 130px; border-radius: 50%;
    background: linear-gradient(135deg, var(--orange) 0%, var(--red) 50%, var(--cyan) 100%);
    box-shadow: 0 0 40px rgba(255, 107, 0, 0.4);
    animation: spin 8s linear infinite;
    animation-play-state: paused;
  }
  .np-art.playing { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .np-title {
    color: var(--orange); font-size: 16px; font-weight: 800;
    text-align: center; margin-top: 6px;
  }
  .np-artist {
    color: var(--cyan); font-size: 13px; font-weight: 600;
    text-align: center;
  }
  .np-progress {
    width: 100%; height: 6px; background: var(--dim);
    border-radius: 3px; margin-top: 6px; overflow: hidden;
  }
  .np-progress-fill {
    height: 100%; width: 42%;
    background: linear-gradient(90deg, var(--orange), var(--lime));
    border-radius: 3px;
  }
  .np-times {
    width: 100%; display: flex; justify-content: space-between;
    color: var(--muted); font-size: 11px; font-weight: 600;
  }
  .np-controls {
    display: flex; align-items: center; gap: 20px; margin-top: 6px;
  }
  .np-controls span {
    font-size: 16px; cursor: pointer;
    transition: transform 0.1s;
  }
  .np-controls span:hover { transform: scale(1.15); filter: brightness(1.3); }
  .np-controls .prev { color: var(--orange); }
  .np-controls .toggle { color: var(--cyan); font-size: 18px; }
  .np-controls .next { color: var(--lime); }

  /* Notifications */
  .scroll { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
  .scroll-title {
    color: var(--muted); font-size: 10px; font-weight: 700;
    letter-spacing: 2px; margin-bottom: 10px;
  }
  .notif {
    margin-bottom: 8px; padding: 10px 0;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .notif-dot {
    width: 10px; height: 10px; border-radius: 50%;
    margin-top: 4px; flex-shrink: 0;
  }
  .notif-dot.urgent { background: var(--red); }
  .notif-dot.normal { background: var(--orange); }
  .notif-dot.low    { background: var(--muted); }
  .notif-body { flex: 1; min-width: 0; }
  .notif-app { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  .notif-app.urgent { color: var(--red); }
  .notif-app.normal { color: var(--orange); }
  .notif-app.low    { color: var(--muted); }
  .notif-summary {
    color: var(--silver); font-size: 13px; font-weight: 700; margin: 2px 0;
  }
  .notif-text { color: var(--muted); font-size: 11px; font-weight: 500; }
  .notif-close {
    background: none; border: none; color: var(--dim);
    font-size: 16px; font-weight: 700; cursor: pointer; padding: 0 4px;
  }
  .notif-close:hover { color: var(--red); }
</style>
</head>
<body>

<div class="desktop"></div>

<div class="notif-center">
  <div class="header">
    <div>
      <span class="title">inbox</span>
      <span class="count">7 new</span>
    </div>
    <div class="actions">
      <button>read all</button>
      <button class="danger">clear</button>
    </div>
  </div>
  <div class="np">
    <div class="np-art playing"></div>
    <div class="np-title">Midnight City</div>
    <div class="np-artist">M83</div>
    <div class="np-progress"><div class="np-progress-fill"></div></div>
    <div class="np-times"><span>1:42</span><span>4:03</span></div>
    <div class="np-controls">
      <span class="prev">&#xf04a;</span>
      <span class="toggle" id="toggle-play" onclick="togglePlay()">&#xf04c;</span>
      <span class="next">&#xf04e;</span>
    </div>
  </div>
  <div class="scroll">
    <div class="scroll-title">notifications</div>
    <div class="notif">
      <div class="notif-dot urgent"></div>
      <div class="notif-body">
        <div class="notif-app urgent">SYSTEM</div>
        <div class="notif-summary">disk space low</div>
        <div class="notif-text">2.1GB free on /home</div>
      </div>
      <button class="notif-close">×</button>
    </div>
    <div class="notif">
      <div class="notif-dot normal"></div>
      <div class="notif-body">
        <div class="notif-app normal">BUILD</div>
        <div class="notif-summary">build complete</div>
        <div class="notif-text">3.2s, 0 errors</div>
      </div>
      <button class="notif-close">×</button>
    </div>
    <div class="notif">
      <div class="notif-dot low"></div>
      <div class="notif-body">
        <div class="notif-app low">MPD</div>
        <div class="notif-summary">now playing: Midnight City</div>
        <div class="notif-text">M83</div>
      </div>
      <button class="notif-close">×</button>
    </div>
    <div class="notif">
      <div class="notif-dot low"></div>
      <div class="notif-body">
        <div class="notif-app low">GIT</div>
        <div class="notif-summary">pushed to origin/main</div>
        <div class="notif-text">3 commits ahead</div>
      </div>
      <button class="notif-close">×</button>
    </div>
    <div class="notif">
      <div class="notif-dot normal"></div>
      <div class="notif-body">
        <div class="notif-app normal">PKG</div>
        <div class="notif-summary">update available</div>
        <div class="notif-text">linux-firmware</div>
      </div>
      <button class="notif-close">×</button>
    </div>
    <div class="notif">
      <div class="notif-dot low"></div>
      <div class="notif-body">
        <div class="notif-app low">BACKUP</div>
        <div class="notif-summary">backup complete</div>
        <div class="notif-text">2.4GB written</div>
      </div>
      <button class="notif-close">×</button>
    </div>
  </div>
</div>

<script>
function togglePlay() {
  const btn = document.getElementById('toggle-play');
  const art = document.querySelector('.np-art');
  if (btn.innerHTML === '\uf04c') {
    btn.innerHTML = '\uf04b';
    art.classList.remove('playing');
  } else {
    btn.innerHTML = '\uf04c';
    art.classList.add('playing');
  }
}
</script>
</body>
</html>
