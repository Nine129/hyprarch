<!DOCTYPE html>
<!--
  PROTOTYPE — Waybar Workspace Button Redesign
  Question: "What should the workspaces look like if we drop the pill/block style?"

  Throwaway HTML. 4 radically different variants, switchable.
  Stays within GTK/CSS capabilities of real Waybar.
  Delete after decision.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype — Workspace Redesign (CGGX Waybar)</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     CGGX Palette (mirrors colors/cggx.css)
     ══════════════════════════════════════════════════════════════ */
  :root {
    --bg:       #0a0a0c;
    --surface:  #151518;
    --border:   #2a2a35;
    --red:      #ff2d55;
    --cyan:     #00e5ff;
    --lime:     #c8ff00;
    --orange:   #ff6b00;
    --silver:   #e8e8f0;
    --muted:    #6a6a80;
    --ws-bg:    #151518;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)),
      url('../wallpapers/cggx.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: 'MonaspiceNe', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--silver);
    min-height: 100vh;
    user-select: none;
  }

  /* ── Prototype watermark ── */
  body::before {
    content: "PROTOTYPE — throwaway, not production";
    position: fixed;
    top: 4px;
    right: 12px;
    font-size: 10px;
    color: var(--red);
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.7;
    z-index: 999;
  }

  /* ══════════════════════════════════════════════════════════════
     SIMULATED WAYBAR
     ══════════════════════════════════════════════════════════════ */
  .waybar {
    width: calc(100% - 24px);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    padding: 0;
    margin: 5px 12px 0 12px;
  }

  .modules-left {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .modules-center { flex: 1; }

  .modules-right {
    display: flex;
    align-items: center;
    gap: 0;
  }

  /* ── Right-side modules (unchanged, for context) ── */
  .pill {
    border: none; border-radius: 0;
    padding: 4px 14px; margin: 0 0.25px;
    font-weight: 600; font-family: inherit;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 1px 0 3px rgba(0,0,0,0.4);
    font-size: 13px;
  }
  .pill.system {
    background: var(--surface);
    margin: 0;
    box-shadow: none;
  }
  .pill.system.disk  { color: var(--lime); }
  .pill.system.mem   { color: var(--orange); }
  .pill.system.temp  { color: var(--cyan); }

  .pill.personal { color: var(--bg); font-size: 14px; }
  .pill.personal.audio   { background: var(--orange); }
  .pill.personal.clock   { background: var(--cyan); }
  .pill.personal.battery { background: var(--lime); }

  .sep {
    background: var(--border);
    min-width: 1px; min-height: 14px;
    margin: 0 6px; border-radius: 0;
  }

  .pill.power-btn {
    background: linear-gradient(180deg, var(--red), rgba(255,45,85,0.85));
    color: var(--bg);
    font-size: 20px; font-weight: 700; padding: 0 14px;
  }

  .tray-placeholder {
    color: var(--muted);
    padding: 4px 8px; font-size: 11px;
  }

  /* ══════════════════════════════════════════════════════════════
     WORKSPACES — VARIANT A: Underline Tabs (solid bg)
     Gapless segmented-control look. All buttons share a continuous
     solid surface. Active = red text + 2px red underline, slightly
     lighter bg. Inactive = solid dark bg, muted text.
     GTK CSS: background: @surface; margin: 0; border-bottom on active.
     ══════════════════════════════════════════════════════════════ */
  .variant-a .ws {
    background: #151518;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: var(--muted);
    padding: 4px 10px;
    margin: 0 0;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    min-width: 28px;
    text-align: center;
    box-shadow: none;
  }
  .variant-a .ws.active {
    color: var(--red);
    border-bottom-color: var(--red);
    background: #1e1e28;
    font-weight: 700;
  }
  .variant-a .ws.urgent {
    color: var(--orange);
    animation: blink-orange-a 1s steps(12) infinite alternate;
  }
  .variant-a .ws.empty {
    color: #3a3a4a;
  }
  .variant-a .ws:hover {
    color: var(--silver);
    background: #1c1c24;
  }
  @keyframes blink-orange-a {
    to { color: var(--silver); }
  }

  /* ══════════════════════════════════════════════════════════════
     WORKSPACES — VARIANT B: Unified Slab
     All 9 workspaces inside a single solid-surface container with
     1px dividers between them. Active workspace has red bg inside
     the slab. Looks like one continuous bar, not individual pills.
     GTK CSS: each button has bg but gapless + thin right border as divider.
     ══════════════════════════════════════════════════════════════ */
  .variant-b .ws {
    background: #151518;
    border: none;
    border-right: 1px solid #252530;
    border-radius: 0;
    color: var(--muted);
    padding: 4px 12px;
    margin: 0 0;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    min-width: 28px;
    text-align: center;
    box-shadow: none;
  }
  .variant-b .ws:last-child {
    border-right: none;
  }
  .variant-b .ws.active {
    background: var(--red);
    color: var(--bg);
    font-weight: 700;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
  }
  .variant-b .ws.urgent {
    color: var(--orange);
    background: #1a1a22;
    animation: blink-orange-b 1s steps(12) infinite alternate;
  }
  .variant-b .ws.empty {
    color: #3a3a4a;
  }
  .variant-b .ws:hover {
    background: #1e1e28;
    color: var(--silver);
  }
  @keyframes blink-orange-b {
    to { color: var(--silver); }
  }

  /* ══════════════════════════════════════════════════════════════
     WORKSPACES — VARIANT C: Minimal Numerals (solid bg)
     Each number on a solid dark surface, gapless. No borders, no
     dividers, no shadows — just numbers on a continuous bar.
     Active = red + bold + slightly scaled up. Everything else muted.
     GTK CSS: background: @surface; padding minimal; no margins.
     ══════════════════════════════════════════════════════════════ */
  .variant-c .ws {
    background: #151518;
    border: none;
    border-radius: 0;
    padding: 4px 10px;
    margin: 0 0;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    color: #4a4a5a;
    transition: color 0.15s ease, font-size 0.15s ease, font-weight 0.15s ease;
    min-width: 22px;
    text-align: center;
    box-shadow: none;
  }
  .variant-c .ws.active {
    color: var(--red);
    font-size: 14px;
    font-weight: 700;
  }
  .variant-c .ws.urgent {
    color: var(--orange);
    font-weight: 600;
    animation: blink-orange-c 1s steps(12) infinite alternate;
  }
  .variant-c .ws.empty {
    color: #2a2a35;
  }
  .variant-c .ws:hover {
    color: var(--silver);
  }
  @keyframes blink-orange-c {
    to { color: var(--silver); }
  }

  /* ══════════════════════════════════════════════════════════════
     WORKSPACES — VARIANT D: Side Accent Bar (solid bg)
     Every button has a solid dark bg. Active gets a 3px red left
     border + slightly brighter bg. Gapless, no dividers.
     GTK CSS: background: @surface; border-left: 3px solid transparent;
              .active { border-left-color: @red; background: lighten(@surface,5%); }
     ══════════════════════════════════════════════════════════════ */
  .variant-d .ws {
    background: #151518;
    border: none;
    border-left: 3px solid transparent;
    border-radius: 0;
    color: var(--muted);
    padding: 4px 12px;
    margin: 0 0;
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.15s ease, background 0.15s ease;
    min-width: 28px;
    text-align: center;
    box-shadow: none;
  }
  .variant-d .ws.active {
    color: var(--silver);
    border-left-color: var(--red);
    background: #1e1e28;
    font-weight: 600;
    font-size: 13px;
  }
  .variant-d .ws.urgent {
    color: var(--orange);
    border-left-color: var(--orange);
    animation: blink-border-d 1s steps(12) infinite alternate;
  }
  .variant-d .ws.empty {
    color: #3a3a4a;
  }
  .variant-d .ws:hover {
    color: var(--silver);
    background: #1c1c24;
  }
  @keyframes blink-border-d {
    to { border-left-color: transparent; }
  }

  /* ══════════════════════════════════════════════════════════════
     LABEL AREA — shows variant name above the bar
     ══════════════════════════════════════════════════════════════ */
  .variant-label {
    text-align: center;
    padding: 24px 0 8px 0;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .variant-label span {
    color: var(--red);
    font-weight: 700;
  }
  .variant-label .desc {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0;
    text-transform: none;
    margin-top: 4px;
    opacity: 0.7;
  }

  /* ══════════════════════════════════════════════════════════════
     FLOATING SWITCHER BAR
     ══════════════════════════════════════════════════════════════ */
  .switcher {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .switcher button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--silver);
    padding: 4px 14px;
    border-radius: 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
  }
  .switcher button:hover {
    background: #1e1e28;
    border-color: var(--red);
    color: var(--red);
  }
  .switcher .variant-name {
    color: var(--silver);
    font-size: 12px;
    font-weight: 600;
    min-width: 240px;
    text-align: center;
  }
  .switcher .variant-name .key {
    color: var(--red);
    font-weight: 700;
  }
  .switcher .variant-name .title {
    color: var(--muted);
  }

  /* ── Key hints ── */
  .key-hint {
    margin-top: 60px;
    margin-bottom: 100px;
    color: var(--muted);
    font-size: 10px;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .key-hint kbd {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--silver);
    padding: 1px 6px;
    border-radius: 0;
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
  }

  /* ── Comparison hint ── */
  .comparison-hint {
    margin-top: 12px;
    color: var(--muted);
    font-size: 10px;
    text-align: center;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="variant-label" id="variant-label">
  Variant <span id="variant-key">A</span>
  <span class="desc" id="variant-desc"></span>
</div>

<!-- ══════════════════════════════════════════════════════════════
     SIMULATED WAYBAR
     ══════════════════════════════════════════════════════════════ -->
<div class="waybar" id="waybar">

  <!-- LEFT: workspaces (variant-switched) + MPRIS -->
  <div class="modules-left" id="modules-left">
    <div id="workspaces-container" class="variant-a">
      <!-- Populated by JS -->
    </div>
    <!-- MPRIS placeholder (not the focus of this prototype) -->
    <span class="pill personal audio" style="margin-left: 8px; font-size: 13px;">
      <span></span>
      <span>Polyphia — Playing God</span>
    </span>
  </div>

  <!-- CENTER: empty -->
  <div class="modules-center"></div>

  <!-- RIGHT: system + personal + utilities (context only) -->
  <div class="modules-right" id="modules-right">
    <span class="pill system disk">/ 81% FREE</span>
    <span class="pill system mem"> 6.4G / 16G</span>
    <span class="pill system temp"> 52°C</span>

    <span class="sep"></span>

    <span class="pill personal audio"> 42%</span>
    <span class="pill personal clock"> Mon 11  14:32</span>
    <span class="pill personal battery"> 87%</span>

    <span class="sep"></span>

    <span class="tray-placeholder">[tray]</span>
    <span class="pill power-btn">⏻</span>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     FLOATING SWITCHER
     ══════════════════════════════════════════════════════════════ -->
<div class="switcher" id="switcher">
  <button id="btn-prev" title="Previous variant (←)">◀ Prev</button>
  <span class="variant-name">
    <span class="key" id="switcher-key">A</span>
    <span class="title" id="switcher-title"></span>
  </span>
  <button id="btn-next" title="Next variant (→)">Next ▶</button>
</div>

<div class="key-hint">
  Use <kbd>←</kbd> <kbd>→</kbd> arrow keys or click buttons to cycle variants &nbsp;|&nbsp;
  Active workspace: <span style="color:var(--red);font-weight:700">WS 1</span> &nbsp;|&nbsp;
  Urgent workspace: <span style="color:var(--orange)">WS 4</span> &nbsp;|&nbsp;
  Empty workspaces: 6-9
</div>

<div class="comparison-hint" id="comparison-hint"></div>

<!-- ══════════════════════════════════════════════════════════════
     SCRIPT
     ══════════════════════════════════════════════════════════════ -->
<script>
  // ── Variant definitions ─────────────────────────────────
  const VARIANTS = [
    {
      key: 'A',
      title: 'Underline Tabs',
      cssClass: 'variant-a',
      desc: 'Active: red text + 2px red bottom border. No backgrounds.',
      glyphs:    ['1','2','3','4','5','6','7','8','9'],
      activeGlyph: null,
      wsAttrs: {
        inactive: { style: '' },
        active:   { style: 'color:var(--red);border-bottom-color:var(--red);font-weight:700' },
      },
      waybarHint: '#workspaces button { background: transparent; border-bottom: 2px solid transparent; } .active { border-bottom-color: @red; color: @red; }',
    },
    {
      key: 'B',
      title: 'Dot Grid',
      cssClass: 'variant-b',
      desc: 'Active: filled red ●. Inactive: hollow ○. No numbers.',
      glyphs:    ['○','○','○','○','○','○','○','○','○'],
      activeGlyph: '●',
      wsAttrs: {
        inactive: { style: 'color:var(--muted);font-size:18px' },
        active:   { style: 'color:var(--red);font-size:20px' },
      },
      waybarHint: '"format-icons": { "1": "●", "2": "○", "default": "○" } on active: color @red, slightly larger',
    },
    {
      key: 'C',
      title: 'Floating Numbers',
      cssClass: 'variant-c',
      desc: 'Pure text labels. Active: red, bold, 14px. Inactive: faint gray, 12px. No containers.',
      glyphs:    ['1','2','3','4','5','6','7','8','9'],
      activeGlyph: null,
      wsAttrs: {
        inactive: { style: 'color:#4a4a5a;font-size:12px;font-weight:500' },
        active:   { style: 'color:var(--red);font-size:14px;font-weight:700' },
      },
      waybarHint: '#workspaces button { background: transparent; border: none; padding: 4px 8px; font-size: 12px; color: #4a4a5a; } .active { color: @red; font-size: 14px; }',
    },
    {
      key: 'D',
      title: 'Side Accent Bar',
      cssClass: 'variant-d',
      desc: 'Active: 3px red left border + subtle red bg tint. Inactive: transparent.',
      glyphs:    ['1','2','3','4','5','6','7','8','9'],
      activeGlyph: null,
      wsAttrs: {
        inactive: { style: 'color:var(--muted);border-left:3px solid transparent;background:transparent' },
        active:   { style: 'color:var(--silver);border-left:3px solid var(--red);background:rgba(255,45,85,0.08)' },
      },
      waybarHint: '#workspaces button { background: transparent; border-left: 3px solid transparent; } .active { border-left-color: @red; background: alpha(@red,0.08); }',
    },
    /* Extras — show the current pill style for contrast */
    {
      key: 'X',
      title: 'Current Pill Style (reference)',
      cssClass: 'variant-x',
      desc: 'Your current design — individual block buttons for comparison.',
      glyphs:    ['1','2','3','4','5','6','7','8','9'],
      activeGlyph: null,
      wsAttrs: {
        inactive: { style: 'background:var(--ws-bg);color:var(--silver);padding:4px 12px;margin:0 2px' },
        active:   { style: 'background:var(--red);color:var(--bg);padding:4px 12px;margin:0 2px;box-shadow:0 0 12px rgba(255,45,85,0.4)' },
      },
      waybarHint: '(current) #workspaces button { background: @surface; padding: 4px 12px; margin: 0 2px; } .active { background: @red; color: @bg; }',
    },
  ];

  // ── Workspace state ─────────────────────────────────────
  const state = {
    active:   1,       // 1-9
    urgent:   4,       // ws 4 is urgent (has a notification, etc.)
    emptyFrom: 6,      // ws 6-9 are empty
  };

  // ── Render ──────────────────────────────────────────────
  const container = document.getElementById('workspaces-container');
  let currentIdx = 0;

  function renderVariant(idx) {
    const v = VARIANTS[idx];
    container.className = v.cssClass;
    container.innerHTML = '';

    for (let i = 1; i <= 9; i++) {
      const btn = document.createElement('span');
      btn.className = 'ws';

      // State classes
      if (i === state.active) btn.classList.add('active');
      if (i === state.urgent && i !== state.active) btn.classList.add('urgent');
      if (i >= state.emptyFrom && i !== state.active && i !== state.urgent) btn.classList.add('empty');

      // Glyph
      if (v.activeGlyph && i === state.active) {
        btn.textContent = v.activeGlyph;
        btn.style.color = 'var(--red)';
        btn.style.fontSize = '20px';
      } else {
        btn.textContent = v.glyphs[i - 1];
        if (v.cssClass === 'variant-x') {
          // keep pill-style inline styles
          if (i === state.active) {
            btn.style.background = 'var(--red)';
            btn.style.color = 'var(--bg)';
            btn.style.padding = '4px 12px';
            btn.style.margin = '0 2px';
            btn.style.boxShadow = '0 0 12px rgba(255,45,85,0.4)';
            btn.style.fontWeight = '600';
          } else {
            btn.style.background = 'var(--surface)';
            btn.style.color = i >= state.emptyFrom ? 'var(--muted)' : 'var(--silver)';
            btn.style.padding = '4px 12px';
            btn.style.margin = '0 2px';
            btn.style.boxShadow = '1px 0 3px rgba(0,0,0,0.4)';
          }
        }
      }

      // Urgent styling overrides
      if (i === state.urgent && i !== state.active && v.cssClass !== 'variant-x') {
        btn.style.color = 'var(--orange)';
      }
      if (i >= state.emptyFrom && i !== state.active && i !== state.urgent && v.cssClass !== 'variant-x') {
        btn.style.opacity = v.cssClass === 'variant-a' ? '0.45' : '';
        if (v.cssClass === 'variant-b') btn.style.color = '#3a3a4a';
        if (v.cssClass === 'variant-c') btn.style.color = '#2a2a35';
        if (v.cssClass === 'variant-d') btn.style.color = '#3a3a4a';
      }

      // Allow clicking to change active workspace
      btn.addEventListener('click', () => {
        state.active = i;
        if (state.urgent === i) state.urgent = 0; // dismiss urgent on activation
        renderVariant(currentIdx);
      });

      btn.title = `Workspace ${i}`;
      container.appendChild(btn);
    }

    // Update labels
    document.getElementById('variant-key').textContent = v.key;
    document.getElementById('variant-desc').textContent = v.desc;
    document.getElementById('switcher-key').textContent = v.key;
    document.getElementById('switcher-title').textContent = ' — ' + v.title;
    document.getElementById('comparison-hint').textContent = v.waybarHint;

    currentIdx = idx;

    // Update active button states
    document.getElementById('btn-prev').style.opacity = idx === 0 ? '0.3' : '1';
    document.getElementById('btn-next').style.opacity = idx === VARIANTS.length - 1 ? '0.3' : '1';
  }

  // ── Navigation ──────────────────────────────────────────
  function prev() {
    const next = (currentIdx - 1 + VARIANTS.length) % VARIANTS.length;
    renderVariant(next);
  }
  function next() {
    const next = (currentIdx + 1) % VARIANTS.length;
    renderVariant(next);
  }

  document.getElementById('btn-prev').addEventListener('click', prev);
  document.getElementById('btn-next').addEventListener('click', next);

  // Keyboard arrows
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    // Number keys jump directly to variant
    const num = parseInt(e.key);
    if (num >= 1 && num <= VARIANTS.length) {
      e.preventDefault();
      renderVariant(num - 1);
    }
  });

  // ── Initial render ──────────────────────────────────────
  renderVariant(0);
</script>

</body>
</html>
