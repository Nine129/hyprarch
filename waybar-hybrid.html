<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0c;
    font-family: 'JetBrains Mono', 'JetBrainsMonoNL Nerd Font Mono', monospace;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .desktop {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2a2a35;
    font-size: 14px;
    font-family: sans-serif;
  }

  .bar {
    width: 100%;
    height: 70px;
    padding: 0 12px;
    margin-top: 5px;
    display: flex;
    align-items: center;
  }

  .bar-inner {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 0 12px;
  }

  .section-left, .section-right { display: flex; align-items: center; gap: 0; }
  .section-left  { flex: 0 0 auto; }
  .section-center { flex: 1; }
  .section-right { flex: 0 0 auto; }

  /* ── Workspace buttons ── */
  .ws {
    background: #1a1a20;
    border: 1px solid #2a2a35;
    padding: 8px 14px;
    margin: 0 2px;
    font-size: 13px;
    font-weight: 600;
    color: #6a6a80;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .ws.active {
    background: #ff2d55;
    color: #0a0a0c;
    box-shadow: 0 0 12px rgba(255,45,85,0.4), 0 2px 8px rgba(0,0,0,0.6);
  }
  .ws.occupied { color: #e8e8f0; }

  /* ── Pills ── */
  .pill {
    padding: 0 14px;
    margin: 0 0.25px;
    height: 36px;
    display: flex;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  /* ── System group: dark bg, colored text ── */
  .sys {
    background: #1a1a20;
    color: #e8e8f0;
  }
  .sys.disk   { color: #c8ff00; }
  .sys.mem    { color: #ff6b00; }
  .sys.net    { color: #00e5ff; }

  /* ── Personal group: colored bg, black text ── */
  .per {
    color: #0a0a0c;
  }
  .per.audio  { background: #ff6b00; }
  .per.clock  { background: #00e5ff; }
  .per.bat    { background: #c8ff00; }

  /* ── Separator ── */
  .sep {
    width: 1px; height: 14px;
    background: #2a2a35;
    margin: 0 6px;
    flex-shrink: 0;
  }

  /* ── Tray ── */
  .tray {
    background: #1a1a20;
    color: #e8e8f0;
    padding: 0 10px;
    margin: 0 0.25px;
    height: 36px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .tray-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #6a6a80;
    opacity: 0.5;
  }

  /* ── Power ── */
  .power {
    background: linear-gradient(180deg, #ff2d55, rgba(255,45,85,0.85));
    color: #0a0a0c;
    padding: 0 14px;
    height: 36px;
    display: flex;
    align-items: center;
    font-size: 20px;
    font-weight: 700;
    margin: 0 0.25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
</style>

<body>

<div class="bar">
  <div class="bar-inner">

    <div class="section-left">
      <span class="ws active">1</span>
      <span class="ws">2</span>
      <span class="ws">3</span>
      <span class="ws">4</span>
      <span class="ws">5</span>
      <span class="ws">6</span>
      <span class="ws">7</span>
      <span class="ws">8</span>
      <span class="ws">9</span>
    </div>

    <div class="section-center"></div>

    <div class="section-right">

      <!-- Group 1: System — dark pill, colored text -->
      <span class="pill sys disk">/ 81% FREE</span>
      <span class="pill sys mem"><span style="font-size:18px;margin-right:5px"></span>6.4G / 15.3G</span>
      <span class="pill sys net"><span style="font-size:18px;margin-right:5px"></span>SSID</span>

      <span class="sep"></span>

      <!-- Group 2: Personal — colored bg, black text -->
      <span class="pill per audio"><span style="font-size:18px;margin-right:5px"></span>42%</span>
      <span class="pill per clock"><span style="font-size:18px;margin-right:5px"></span>Thu 05  01:06</span>
      <span class="pill per bat"><span style="font-size:18px;margin-right:5px"></span>73%</span>

      <span class="sep"></span>

      <!-- Group 3: Utilities -->
      <span class="tray"><span class="tray-dot"></span><span class="tray-dot"></span></span>
      <span class="power">⏻</span>

    </div>
  </div>
</div>

<div class="desktop">(desktop background)</div>

</body>
</html>
