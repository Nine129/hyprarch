# ── CGGX Hyprpaper ──────────────────────────────────────
# Wallpaper daemon for Hyprland
# Place at: ~/.config/hypr/hyprpaper.conf
# Spawn via: hyprctl dispatch exec hyprpaper
#
# Monitor names from: hyprctl monitors all
# Single monitor setup: eDP-1 (laptop) or DP-1 (desktop)

# ── Splash ──────────────────────────────────────────────
splash = false

# ── IPC ─────────────────────────────────────────────────
ipc = true

# ── Wallpaper ────────────────────────────────────────────
# NOTE: Replace monitor name (eDP-1) with your output from `hyprctl monitors`
# NOTE: $HOME is expanded; ~ is NOT

preload = /home/nine/.local/share/wallpapers/cggx.webp

wallpaper = eDP-1,/home/nine/.local/share/wallpapers/cggx.webp
