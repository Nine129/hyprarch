# ── CGGX Hyprlock ──────────────────────────────────────
# Lock screen for Hyprland
# Place at: ~/.config/hypr/hyprlock.conf

general {
    no_fade_in = false
    no_fade_out = false
    fade_duration = 200
    hide_cursor = true
    grace = 5
}

background {
    path = $HOME/.local/share/wallpapers/cggx.webp
    blur_passes = 3
    blur_size = 8
    noise = 1e-2
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.2
}

input-field {
    monitor = eDP-1
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(255, 45, 85, 0.6)
    inner_color = rgba(26, 26, 32, 0.8)
    font_color = #e8e8f0
    fade_on_empty = false
    placeholder_text = <i>password...</i>
    halign = center
    valign = center
    position = 0, 100
}

# Clock — CGGX red glow
label {
    monitor = eDP-1
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = #e8e8f0
    font_size = 72
    font_family = Share Tech Mono
    halign = center
    valign = center
    position = 0, -80
}

# Accent bar under clock
label {
    monitor = eDP-1
    text = ─── ● ───
    color = #ff2d55
    font_size = 14
    font_family = MonaspiceNe Nerd Font
    halign = center
    valign = center
    position = 0, -40
}

# Date — muted gray
label {
    monitor = eDP-1
    text = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color = #6a6a80
    font_size = 16
    font_family = MonaspiceNe Nerd Font
    halign = center
    valign = center
    position = 0, -20
}

            