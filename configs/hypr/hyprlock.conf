$wall = $HOME/.local/share/wallpapers/miku-glitch.webp

# BACKGROUND
background {
    monitor =
    path = $wall
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    fail_timeout = 0  # allow immediate re-entry after wrong password
}

# PASSWORD INPUT - centered in the bottom black bar
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    rounding = 12
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    check_color = rgba(0, 255, 0, 0.6)
    fail_color = rgba(255, 50, 50, 0.85)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##ffffff99">   Enter Password</span></i>
    fail_text = <b><span foreground="#ff5555">  Wrong password</span></b>
    hide_input = false
    position = 0, 120
    halign = center
    valign = bottom
}
