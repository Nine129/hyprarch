# ── CGGX Starship Prompt ───────────────────────────────
# Place at: ~/.config/starship.toml
# Kinetic cyberpunk palette — matches waybar / hyprland / yazi
# Reload: pkill -USR1 starship || exec $SHELL

# ── Format ─────────────────────────────────────────────
format = "$os $directory $git_branch$git_status$cmd_duration\n$character"

# ── Palette ────────────────────────────────────────────
palette = "cggx"

[palettes.cggx]
red = "#ff2d55"
cyan = "#00e5ff"
lime = "#c8ff00"
orange = "#ff6b00"
purple = "#b48cff"
silver = "#e8e8f0"
muted = "#6a6a80"

# ── Character (prompt symbol) ──────────────────────────
[character]
success_symbol = "[❯](red)"
error_symbol = "[❯](red bold)"

# ── Directory ──────────────────────────────────────────
[directory]
style = "cyan"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 🔒"
read_only_style = "orange"

# ── Git branch ─────────────────────────────────────────
[git_branch]
style = "purple"
format = "[$symbol$branch]($style) "
symbol = " "

# ── Git status ─────────────────────────────────────────
[git_status]
style = "muted"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✔"
untracked = "?"
stashed = "📦"
modified = "!"
staged = "✚"
renamed = "»"
deleted = "✘"

# ── Command duration ───────────────────────────────────
[cmd_duration]
style = "muted"
format = "⏱️ [$duration]($style) "
min_time_to_notify = 2000
show_milliseconds = false

# ── OS ─────────────────────────────────────────────────
[os]
format = "[$symbol]($style) "
style = "muted"
disabled = false

[os.symbols]
Windows = "🪟"
Arch = "󰣇"

# ── Time ───────────────────────────────────────────────
[time]
disabled = false
style = "muted"
format = "[$time]($style) "
time_format = "%T"
use_12hr = false

# ── Node.js ────────────────────────────────────────────
[nodejs]
style = "lime"
format = "[⬢ $version]($style) "
disabled = false

# ── Rust ───────────────────────────────────────────────
[rust]
style = "orange"
format = "[🦀 $version]($style) "
disabled = false

# ── Python ─────────────────────────────────────────────
[python]
style = "cyan"
format = "[🐍 $version]($style) "
disabled = false

# ── Shell ──────────────────────────────────────────────
[shell]
style = "muted"
disabled = false
format = "[$indicator]($style) "
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"

            