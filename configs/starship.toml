# ── CGGX Starship Prompt — Powerline ──────────────────
# Place at: ~/.config/starship.toml
# Reload: pkill -USR1 starship || exec $SHELL

"$schema" = 'https://starship.rs/config-schema.json'

# NOTE: format MUST come before palette/module sections
# or starship silently falls back to defaults.
format = "$os[](fg:red bg:border)$directory[](fg:border bg:orange)$git_branch $git_status [](fg:orange bg:muted)$cmd_duration $fill$hostname $time  \n$character"

# ── Palette ────────────────────────────────────────────
palette = "cggx"

[palettes.cggx]
red    = "#ff2d55"
purple = "#b48cff"
muted  = "#6a6a80"
silver = "#e8e8f0"
border = "#2a2a35"
bg0    = "#0a0a0c"
orange = "#ff6b00"
lime   = "#C8FF00"
cyan   = "#00e5ff"

# ── Transient prompt (zsh) ─────────────────────────────
# What an accepted command line collapses to. Rendered by the
# zsh-transient-prompt widget hook in shell/.zshrc via:
#   starship prompt --profile transient
[profiles]
transient = "$character"

# ── Character (line 2) ─────────────────────────────────
[character]
success_symbol            = '[❯](bold red)'
error_symbol              = '[❯](bold red)'
vimcmd_symbol             = '[❮](bold red)'
vimcmd_replace_symbol     = '[❮](bold purple)'
vimcmd_visual_symbol      = '[❮](bold orange)'

# ── OS (leftmost anchor) ───────────────────────────────
[os]
disabled = false
style    = "bg:red fg:bg0 bold"
format   = '[  $symbol  ]($style)'

[os.symbols]
Arch    = "󰣇"
Windows = "🪟"
Linux   = "󰌽"

# ── Directory (neutral anchor pill) ────────────────────
[directory]
style             = "bg:border fg:silver bold"
format            = '[  $path  ]($style)'
truncation_length = 3
truncation_symbol = "…/"
home_symbol       = "~"
read_only         = " 🔒"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = ""
"Music"     = "󰝚 "
"Pictures"  = ""
"Developer" = "󰲋 "
"Projects"  = ""

# ── Git Branch ─────────────────────────────────────────
[git_branch]
style  = "bg:orange fg:bg0 bold"
format = '[  $branch  ]($style)'
symbol = ""

# ── Git Status (counts only, no bg) ─────────────────────
[git_status]
format     = ' ($all_status$ahead_behind) '
style      = ""
modified   = "[\uF040 $count ](fg:lime)"
untracked  = "[\uF059 $count ](fg:muted)"
staged     = "[\uF058 $count ](fg:cyan)"
deleted    = "[\uF014 $count ](fg:red)"
ahead      = "[\uF062 $count ](fg:cyan)"
behind     = "[\uF063 $count ](fg:red)"
diverged   = "[\U000F047E $ahead_count \U000F047F $behind_count ](fg:orange)"
conflicted = "[\uF06A $count ](fg:red)"
stashed    = "[\uF0C6 $count ](fg:cyan)"
renamed    = "[\uF045 $count ](fg:muted)"

# ── Command Duration ───────────────────────────────────
[cmd_duration]
style              = "bg:muted fg:silver bold"
format             = '[  󰥔  $duration  ]($style)'
min_time_to_notify = 0
show_milliseconds  = false

# ── Languages (disabled — enable per-project) ──────────
[nodejs]
disabled = true
style    = "bg:lime fg:bg0"
format   = '[  ⬢ $version  ]($style)'

[rust]
disabled = true
style    = "bg:orange fg:bg0"
format   = '[   $version  ]($style)'

[python]
disabled = true
style    = "bg:cyan fg:bg0"
format   = '[   $version  ]($style)'

# ── Hostname (right side) ──────────────────────────────
[hostname]
ssh_only = false
style    = "bg:lime fg:bg0 bold"
format   = '[  󰒋 $hostname  ]($style)'

# ── Time (right side) ──────────────────────────────────
[time]
disabled   = false
time_format = "%T"
style      = "bg:cyan fg:bg0 bold"
format     = '[  󰥔 $time  ]($style)'

# ── Fill (spacer, no dots) ──────────────────────────────
[fill]
symbol = " "
