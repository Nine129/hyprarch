[mgr]
prepend_keymap = [
  # Quick locations
  { on = [ "g", "v" ], run = "cd ~/vault", desc = "Go to vault" },
  # Shift+Up/Down → page scroll (same as PageUp/PageDown)
  { on = "<S-Up>", run = "arrow -100%", desc = "Move cursor up by a page" },
  { on = "<S-Down>", run = "arrow 100%", desc = "Move cursor down by a page" },

  # Shift+Enter → show "open with" picker
  { on = "<S-Enter>", run = "open --interactive", desc = "Open with picker" },

  # e → "open with" picker (edit, reveal, ...)
  { on = ["e"], run = "open --interactive", desc = "Open with picker" },

  # o → open in browser/xdg
  { on = ["o"], run = "open", desc = "Open with default app" },

  # C → compress selected files with ouch
  { on = ["C"], run = "plugin ouch", desc = "Compress with ouch" },

# copy file contet
{
on = "<Y>",
run = ["plugin copy-file-contents"],
desc = "Copy contents of file",
},
{ on = [ "Q" ], run = "close", desc = "Close current tab" },

# Z → zoxide via fzf (styled through wrapper)
{ on = ["Z"], run = "shell --block ~/.config/yazi/scripts/zoxide-fzf.sh", desc = "Zoxide via fzf" },
# { on   = "f", run  = "plugin smart-filter", desc = "Smart filter"},
{on   = "Enter",
run  = "plugin smart-enter",
desc = "Enter the child directory, or open the file"},


{ on = [ ";" ],
  run = 'plugin custom-shell zsh --block=false', 
  desc = "custom-shell as default"},
]
