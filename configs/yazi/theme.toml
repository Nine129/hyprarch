# ── CGGX Yazi Theme ────────────────────────────────────
# Place at: ~/.config/yazi/theme.toml
# Yazi is a terminal file manager — fast, Rust-based, Kitty-native
# https://github.com/sxyazi/yazi
#
# Palette: CGGX kinetic brutalist
#   Red #ff2d55  ·  Cyan #00e5ff  ·  Lime #c8ff00
#   Orange #ff6b00  ·  Purple #b48cff  ·  Silver #e8e8f0  ·  Muted #6a6a80

# ── File-type colors ───────────────────────────────────
[filetype]
rules = [
  # Directories — cyan like waybar clock
  { name = "*", type = "directory", fg = "#00e5ff" },

  # Images / video — purple like fetch artwork
  { name = "*.png",  fg = "#b48cff" },
  { name = "*.jpg",  fg = "#b48cff" },
  { name = "*.jpeg", fg = "#b48cff" },
  { name = "*.gif",  fg = "#b48cff" },
  { name = "*.webp", fg = "#b48cff" },
  { name = "*.svg",  fg = "#b48cff" },
  { name = "*.mp4",  fg = "#b48cff" },
  { name = "*.mov",  fg = "#b48cff" },

  # Audio — red like accent
  { name = "*.mp3",  fg = "#ff2d55" },
  { name = "*.flac", fg = "#ff2d55" },
  { name = "*.wav",  fg = "#ff2d55" },
  { name = "*.aac",  fg = "#ff2d55" },
  { name = "*.ogg",  fg = "#ff2d55" },

  # Archives — lime like waybar disk
  { name = "*.zip",  fg = "#c8ff00" },
  { name = "*.tar",  fg = "#c8ff00" },
  { name = "*.gz",   fg = "#c8ff00" },
  { name = "*.xz",   fg = "#c8ff00" },
  { name = "*.bz2",  fg = "#c8ff00" },
  { name = "*.7z",   fg = "#c8ff00" },

  # Config / code — orange like waybar memory
  { name = "*.lua",  fg = "#ff6b00" },
  { name = "*.conf", fg = "#ff6b00" },
  { name = "*.json", fg = "#ff6b00" },
  { name = "*.toml", fg = "#ff6b00" },
  { name = "*.yaml", fg = "#ff6b00" },
  { name = "*.ini",  fg = "#ff6b00" },
  { name = "*.css",  fg = "#ff6b00" },
  { name = "*.html", fg = "#ff6b00" },
  { name = "*.xml",  fg = "#ff6b00" },

  # Source code — cyan like waybar net-icon
  { name = "*.rs",   fg = "#00e5ff" },
  { name = "*.py",   fg = "#00e5ff" },
  { name = "*.js",   fg = "#00e5ff" },
  { name = "*.ts",   fg = "#00e5ff" },
  { name = "*.go",   fg = "#00e5ff" },
  { name = "*.c",    fg = "#00e5ff" },
  { name = "*.h",    fg = "#00e5ff" },
  { name = "*.cpp",  fg = "#00e5ff" },
  { name = "*.zig",  fg = "#00e5ff" },

  # Documents — silver
  { name = "*.md",   fg = "#e8e8f0" },
  { name = "*.txt",  fg = "#e8e8f0" },
  { name = "*.pdf",  fg = "#e8e8f0" },

  # Executables — lime
  { name = "*", type = "executable", fg = "#c8ff00" },

  # Symlinks — red
  { name = "*", type = "symlink", fg = "#ff2d55" },

  # Special: makefiles, docker, etc — orange
  { name = "Makefile",  fg = "#ff6b00" },
  { name = "Dockerfile", fg = "#ff6b00" },
]

# ── Manager (file listing) ─────────────────────────────
[manager]
[manager.preview]
selected = { fg = "#e8e8f0", bg = "#1a1a20" }

[manager]
syntect_theme = "catppuccin-mocha"

# ── Folder / file icons ────────────────────────────────
[icon]
rules = [
  { name = "*", type = "directory", fg = "#00e5ff" },
  { name = "*.png",  fg = "#b48cff" },
  { name = "*.jpg",  fg = "#b48cff" },
  { name = "*.webp", fg = "#b48cff" },
  { name = "*.mp3",  fg = "#ff2d55" },
  { name = "*.flac", fg = "#ff2d55" },
  { name = "*.zip",  fg = "#c8ff00" },
  { name = "*.tar",  fg = "#c8ff00" },
  { name = "*.lua",  fg = "#ff6b00" },
  { name = "*.json", fg = "#ff6b00" },
  { name = "*.toml", fg = "#ff6b00" },
  { name = "*.conf", fg = "#ff6b00" },
  { name = "*.rs",   fg = "#00e5ff" },
  { name = "*.py",   fg = "#00e5ff" },
  { name = "*.js",   fg = "#00e5ff" },
  { name = "*.md",   fg = "#e8e8f0" },
  { name = "*", type = "executable", fg = "#c8ff00" },
  { name = "*", type = "symlink", fg = "#ff2d55" },
]

# ── Status bar ─────────────────────────────────────────
[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#ff2d55", bg = "#1a1a20" }

[status.mode_normal]
fg = "#e8e8f0"
bg = "#ff2d55"

[status.mode_select]
fg = "#0a0a0c"
bg = "#c8ff00"

[status.mode_unset]
fg = "#0a0a0c"
bg = "#6a6a80"

[status.progress_label]
fg = "#e8e8f0"
bg = "#1a1a20"

[status.progress_bar]
fg = "#ff2d55"
bg = "#1a1a20"

[status.permalink]
fg = "#ff6b00"
bg = "#0a0a0c"

[status.offset]
fg = "#00e5ff"
bg = "#0a0a0c"

[status.limit]
fg = "#b48cff"
bg = "#0a0a0c"

# ── Input bar ──────────────────────────────────────────
[input]
fg = "#e8e8f0"
bg = "#0a0a0c"

# ── Selection ──────────────────────────────────────────
[select]
fg = "#e8e8f0"
bg = "#1a1a20"
border = "#ff2d55"

# ── Key which popup ───────────────────────────────────
[which]
fg = "#e8e8f0"
bg = "#1a1a20"
mask = "#6a6a80"
candidates = 10
# Candidate key colors
[which.key]
fg = "#ff2d55"
bg = "#0a0a0c"

[which.desc]
fg = "#e8e8f0"
bg = "#0a0a0c"

# ── Help menu ──────────────────────────────────────────
[help]
fg = "#e8e8f0"
bg = "#0a0a0c"
on = { fg = "#ff2d55", bg = "#1a1a20" }
desc = { fg = "#6a6a80", bg = "#0a0a0c" }
exec = { fg = "#00e5ff", bg = "#0a0a0c" }

# ── Hovered file ──────────────────────────────────────
[hovered]
fg = "#e8e8f0"
bg = "rgba(255,45,85,0.12)"
border = "#ff2d55"

# ── Footer ─────────────────────────────────────────────
[footer]
fg = "#6a6a80"
bg = "#0a0a0c"

# ── Tabs ───────────────────────────────────────────────
[tab.active]
fg = "#e8e8f0"
bg = "#1a1a20"

[tab.inactive]
fg = "#6a6a80"
bg = "#0a0a0c"

            