# ── Manager ────────────────────────────────────────────
[mgr]
syntect_theme = ""
border_symbol = "│"
border_style = { fg = "#703b3a" }

[mgr.cwd]
fg = "#e8e8f0"

[mgr.find_keyword]
fg = "#ff2d55"

[mgr.find_position]
fg = "#ff6b00"

[mgr.symlink_target]
fg = "#6a6a80"

[mgr.marker_selected]
fg = "#ff2d55"

[mgr.marker_copied]
fg = "#c8ff00"

[mgr.marker_cut]
fg = "#ff2d55"

[mgr.marker_marked]
fg = "#bd00ff"

[mgr.count_selected]
fg = "#ff2d55"

[mgr.count_copied]
fg = "#c8ff00"

[mgr.count_cut]
fg = "#ff2d55"

[mgr.preview]
selected = { fg = "#e8e8f0", bg = "#1a1a20" }

# ── Indicator bars ─────────────────────────────────────
[indicator]
parent = { fg = "#000000", bg = "#ff6b00" }
current = { fg = "#000000", bg = "#c8ff00", bold = true }
preview = { fg = "#2a2a35" }
padding = { open = " ", close = " " }

# ── Tabs ───────────────────────────────────────────────
[tabs]
active = { fg = "#000000", bg = "#ff6b00" }
inactive = { fg = "#6a6a80", bg = "#0a0a0c" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# ── Mode indicators ────────────────────────────────────
[mode]
normal_main = { fg = "#0a0a0c", bg = "#ff2d55" }
normal_alt = { fg = "#e8e8f0", bg = "#1a1a20" }
select_main = { fg = "#0a0a0c", bg = "#c8ff00" }
select_alt = { fg = "#e8e8f0", bg = "#1a1a20" }
unset_main = { fg = "#0a0a0c", bg = "#6a6a80" }
unset_alt = { fg = "#e8e8f0", bg = "#1a1a20" }

# ── Status bar — HUD ──────────────────────────────────
[status]
overall = { fg = "#e8e8f0", bg = "#1a1a20" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

[status.perm_type]
fg = "#ff2d55"

[status.perm_read]
fg = "#e8e8f0"

[status.perm_write]
fg = "#ff6b00"

[status.perm_exec]
fg = "#c8ff00"

[status.perm_sep]
fg = "#6a6a80"

[status.progress_label]
fg = "#e8e8f0"

[status.progress_normal]
fg = "#ff2d55"

[status.progress_error]
fg = "#ff2d55"

# ── Which (key hints) ─────────────────────────────────
[which]
cols = 3
mask = { fg = "#6a6a80", bg = "#1a1a20" }
cand = { fg = "#ff2d55" }
rest = { fg = "#e8e8f0" }
desc = { fg = "#6a6a80" }
separator = " → "
separator_style = { fg = "#6a6a80" }


# ── Picker (zoxide, find, etc.) ─────────────────────────
[picker]
border = { fg = "#c8ff00" }
title = { fg = "#e8e8f0" }

[picker.list]
fg = "#e8e8f0"
bg = "#151518"

[picker.highlight]
fg = "#0a0a0c"
bg = "#ff2d55"

[picker.header]
fg = "#c8ff00"
bg = "#0a0a0c"

[picker.input]
fg = "#e8e8f0"
bg = "#151518"
# ── Confirm dialog ─────────────────────────────────────
[confirm]
border = { fg = "#ff2d55" }
title = { fg = "#e8e8f0" }
body = { fg = "#6a6a80" }
list = { fg = "#e8e8f0" }
btn_yes = { fg = "#0a0a0c", bg = "#ff2d55" }
btn_no = { fg = "#e8e8f0", bg = "#1a1a20" }
btn_labels = [">> Yes", "No"]

# ── Spot (file details) ────────────────────────────────
[spot]
border = { fg = "#2a2a35" }
title = { fg = "#e8e8f0" }
tbl_col = { fg = "#ff2d55" }
tbl_cell = { fg = "#e8e8f0" }

# ── Notifications ──────────────────────────────────────
[notify]
success = { fg = "#c8ff00" }
error = { fg = "#ff2d55" }
warn = { fg = "#ff6b00" }
info = { fg = "#e8e8f0" }

# ── Git status signs ───────────────────────────────────
[git]
modified_sign  = "M"
modified       = { fg = "#c8ff00" }

added_sign     = "+"
added          = { fg = "#c8ff00" }

deleted_sign   = "✗"
deleted        = { fg = "#ff2d55", bold = true }

ignored_sign   = "!"
ignored        = { fg = "#6a6a80" }

clean_sign     = ""
untracked_sign = ""
unknown_sign   = ""
