# ── CGGX Yazi Theme ────────────────────────────────────
# Place at: ~/.config/yazi/theme.toml
# https://github.com/sxyazi/yazi
#
# Palette: CGGX kinetic cyberpunk
#   Base    #0a0a0c  ·  Surface  #1a1a20  ·  Border  #2a2a35
#   Red     #ff2d55  ·  Cyan     #00e5ff  ·  Lime    #c8ff00
#   Orange  #ff6b00  ·  Purple   #bd00ff  ·  Lavender #b48cff
#   Silver  #e8e8f0  ·  Muted    #6a6a80

# ── File-type colors (hybrid MIME + url) ───────────────
[filetype]
rules = [
  # Source code — amber (before catch-alls)
  { url = "*.rs",     name = " ", fg = "#E0A500" },
  { url = "*.py",     name = " ", fg = "#E0A500" },
  { url = "*.js",     name = " ", fg = "#E0A500" },
  { url = "*.ts",     name = " ", fg = "#E0A500" },
  { url = "*.go",     name = " ", fg = "#E0A500" },
  { url = "*.c",      name = " ", fg = "#E0A500" },
  { url = "*.h",      name = " ", fg = "#E0A500" },
  { url = "*.cpp",    name = " ", fg = "#E0A500" },
  { url = "*.hpp",    name = " ", fg = "#E0A500" },
  { url = "*.zig",    name = " ", fg = "#E0A500" },
  { url = "*.vue",    name = " ", fg = "#E0A500" },
  { url = "*.svelte", name = " ", fg = "#E0A500" },

  # Config / markup — orange
  { url = "*.html",   name = " ", fg = "#ff6b00" },
  { url = "*.css",    name = " ", fg = "#ff6b00" },
  { url = "*.toml",   name = " ", fg = "#ff6b00" },
  { url = "*.yaml",   name = " ", fg = "#ff6b00" },
  { url = "*.yml",    name = " ", fg = "#ff6b00" },
  { url = "*.json",   name = " ", fg = "#ff6b00" },
  { url = "*.lua",    name = " ", fg = "#ff6b00" },
  { url = "*.conf",   name = " ", fg = "#ff6b00" },
  { url = "*.ini",    name = " ", fg = "#ff6b00" },
  { url = "*.nix",    name = " ", fg = "#ff6b00" },
  { url = "*.env",    name = " ", fg = "#ff6b00" },
  { url = "*.cfg",    name = " ", fg = "#ff6b00" },

  # Shell scripts / misc code — lavender
  { url = "*.sh",     name = " ", fg = "#b48cff" },
  { url = "*.bash",   name = " ", fg = "#b48cff" },
  { url = "*.zsh",    name = " ", fg = "#b48cff" },
  { url = "*.fish",   name = " ", fg = "#b48cff" },
  { url = "*.java",   name = " ", fg = "#b48cff" },
  { url = "*.kt",     name = " ", fg = "#b48cff" },
  { url = "*.rb",     name = " ", fg = "#b48cff" },
  { url = "*.php",    name = " ", fg = "#b48cff" },
  { url = "*.hs",     name = " ", fg = "#b48cff" },
  { url = "*.pl",     name = " ", fg = "#b48cff" },
  { url = "*.cs",     name = " ", fg = "#b48cff" },
  { url = "*.swift",  name = " ", fg = "#b48cff" },

  # Directories — cyan
  { url = "*/",       name = " ", fg = "#00e5ff" },

  # Images — hot purple (URL first, MIME fallback)
  { url = "*.png",     name = " ", fg = "#bd00ff" },
  { url = "*.jpg",     name = " ", fg = "#bd00ff" },
  { url = "*.jpeg",    name = " ", fg = "#bd00ff" },
  { url = "*.gif",     name = " ", fg = "#bd00ff" },
  { url = "*.svg",     name = " ", fg = "#bd00ff" },
  { url = "*.webp",    name = " ", fg = "#bd00ff" },
  { url = "*.bmp",     name = " ", fg = "#bd00ff" },
  { url = "*.ico",     name = " ", fg = "#bd00ff" },
  { url = "*.tiff",    name = " ", fg = "#bd00ff" },
  { mime = "image/*", name = " ", fg = "#bd00ff" },

  # Video — hot purple (URL first, MIME fallback)
  { url = "*.mp4",     name = " ", fg = "#bd00ff" },
  { url = "*.mkv",     name = " ", fg = "#bd00ff" },
  { url = "*.avi",     name = " ", fg = "#bd00ff" },
  { url = "*.mov",     name = " ", fg = "#bd00ff" },
  { url = "*.webm",    name = " ", fg = "#bd00ff" },
  { url = "*.flv",     name = " ", fg = "#bd00ff" },
  { url = "*.m4v",     name = " ", fg = "#bd00ff" },
  { url = "*.mpg",     name = " ", fg = "#bd00ff" },
  { url = "*.mpeg",    name = " ", fg = "#bd00ff" },
  { mime = "video/*", name = " ", fg = "#bd00ff" },

  # Audio — red (URL first, MIME fallback)
  { url = "*.mp3",     name = " ", fg = "#ff2d55" },
  { url = "*.flac",    name = " ", fg = "#ff2d55" },
  { url = "*.wav",     name = " ", fg = "#ff2d55" },
  { url = "*.ogg",     name = " ", fg = "#ff2d55" },
  { url = "*.m4a",     name = " ", fg = "#ff2d55" },
  { url = "*.aac",     name = " ", fg = "#ff2d55" },
  { url = "*.wma",     name = " ", fg = "#ff2d55" },
  { url = "*.opus",    name = " ", fg = "#ff2d55" },
  { url = "*.ape",     name = " ", fg = "#ff2d55" },
  { url = "*.mid",     name = " ", fg = "#ff2d55" },
  { url = "*.midi",    name = " ", fg = "#ff2d55" },
  { mime = "audio/*", name = " ", fg = "#ff2d55" },

  # Archives / compressed — silver
  { url = "*.zip",    name = " ", fg = "#e8e8f0" },
  { url = "*.tar",    name = " ", fg = "#e8e8f0" },
  { url = "*.gz",     name = " ", fg = "#e8e8f0" },
  { url = "*.xz",     name = " ", fg = "#e8e8f0" },
  { url = "*.bz2",    name = " ", fg = "#e8e8f0" },
  { url = "*.7z",     name = " ", fg = "#e8e8f0" },
  { url = "*.rar",    name = " ", fg = "#e8e8f0" },
  { url = "*.zst",    name = " ", fg = "#e8e8f0" },
  { url = "*.iso",    name = " ", fg = "#e8e8f0" },
  { url = "*.deb",    name = " ", fg = "#e8e8f0" },
  { url = "*.rpm",    name = " ", fg = "#e8e8f0" },

  # Documents — lime
  { url = "*.md",     name = " ", fg = "#c8ff00" },
  { url = "*.txt",    name = " ", fg = "#c8ff00" },
  { url = "*.pdf",    name = " ", fg = "#c8ff00" },
  { url = "*.doc",    name = " ", fg = "#c8ff00" },
  { url = "*.docx",   name = " ", fg = "#c8ff00" },
  { url = "*.rtf",    name = " ", fg = "#c8ff00" },

  # Fonts — silver
  { url = "*.ttf",    name = " ", fg = "#e8e8f0" },
  { url = "*.otf",    name = " ", fg = "#e8e8f0" },
  { url = "*.woff",   name = " ", fg = "#e8e8f0" },
  { url = "*.woff2",  name = " ", fg = "#e8e8f0" },

  # Logs / binary / database — muted
  { url = "*.log",    name = " ", fg = "#6a6a80" },
  { url = "*.bin",    name = " ", fg = "#6a6a80" },
  { url = "*.dat",    name = " ", fg = "#6a6a80" },
  { url = "*.db",     name = " ", fg = "#6a6a80" },
  { url = "*.sqlite", name = " ", fg = "#6a6a80" },
  { url = "*.lock",   name = " ", fg = "#6a6a80" },

  # Executables — red
  { url = "*", is = "exec", name = " ", fg = "#ff2d55" },

  # Symlinks — red
  { url = "*", is = "orphan", name = " ", fg = "#ff2d55" },

  # Special files
  { url = "Makefile",      name = " ", fg = "#ff6b00" },
  { url = "Dockerfile",    name = " ", fg = "#ff6b00" },
  { url = ".gitignore",    name = " ", fg = "#ff2d55" },
  { url = ".gitconfig",    name = " ", fg = "#ff2d55" },
  { url = ".editorconfig", name = " ", fg = "#ff6b00" },
]

