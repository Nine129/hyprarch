# ── CGGX Btop Theme ─────────────────────────────────────
# Place at: ~/.config/btop/btop.conf
# Terminal system monitor — CPU, MEM, DISK, NET, PROC
#
# Palette: red #ff2d55  ·  cyan #00e5ff  ·  lime #c8ff00
#          orange #ff6b00  ·  purple #b48cff  ·  silver #e8e8f0

# ── Theme (synced colors, 256‑safe) ─────────────────────
theme_background = "#0a0a0c"
theme_main = "#e8e8f0"
theme_alt = "#6a6a80"
theme_highlight = "#ff2d55"
theme_highlight_fg = "#e8e8f0"
theme_selection = "#ff2d55"
theme_hover = "#ff2d55"
theme_active_fg = "#e8e8f0"
theme_active_bg = "#ff2d55"
theme_inactive_fg = "#6a6a80"
theme_inactive_bg = "#1a1a20"

# ── Graph colors (match mockup) ─────────────────────────
cpu_graph_color = "#ff2d55"    # red
mem_graph_color = "#00e5ff"    # cyan
swap_graph_color = "#c8ff00"    # lime
net_graph_color = "#b48cff"    # purple
temp_graph_color = "#ff6b00"    # orange
proc_signal = "#ff2d55"
proc_core = "#00e5ff"
proc_rates = "#c8ff00"
proc_misc = "#ff6b00"
proc_percent = "#b48cff"
proc_p_cpu = "#e8e8f0"
proc_p_mem = "#6a6a80"

# ── Layout ──────────────────────────────────────────────
color_theme = "Default"
rounded_corners = false
graph_symbol = "braille"
graph_lines = true
show_clock = true
clock_format = "%H:%M"
base_10_sizes = false
shown_boxes = "cpu mem net proc"

# ── CPU ─────────────────────────────────────────────────
cpu_sompatible = false
cpu_sensor = "Auto"
cpu_bottom = 0
cpu_top = 100

# ── Memory ──────────────────────────────────────────────
mem_bottom = 0
mem_top = 100
swap_bottom = 0
swap_top = 100
show_swap = true
swap_disk = true
mem_hide_swap = false

# ── Disks ───────────────────────────────────────────────
disk_show_io = true
disk_free = false

# ── Network ─────────────────────────────────────────────
net_download = 100
net_upload = 100
net_sync = false

# ── Processes ───────────────────────────────────────────
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = true
proc_show = true
proc_count = 12
proc_depth = 3

# ── Misc ────────────────────────────────────────────────
preserve_aspect = true
tty_mode = false
log_level = "WARNING"

            