<!DOCTYPE html>
<!--
  PROTOTYPE — Waybar MPD Now-Playing Pill
  Question: "How will the MPD pill look and behave with different format strings,
             accent colors, placeholders, and status icons?"

  Throwaway HTML. Answers the open questions from the handoff, then DELETE.
  Lives next to the real waybar configs for context.

  Open:   waybar --config ~/.config/waybar/config.jsonc  (real bar)
  Here:   open prototype-mpd-pill.html in any browser
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype — Waybar MPD Pill (CGGX)</title>
<style>
  /* ── CGGX Palette (mirrors colors/cggx.css) ── */
  :root {
    --bg:       #0a0a0c;
    --surface:  #151518;
    --border:   #2a2a35;
    --red:      #ff2d55;
    --cyan:     #00e5ff;
    --lime:     #c8ff00;
    --orange:   #ff6b00;
    --silver:   #e8e8f0;
    --muted:    #6a6a80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    /* Wallpaper background — mirrors the user's Hyprland wallpaper */
    background:
      linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.45)),
      url('../../wallpapers/cggx.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--silver);
    min-height: 100vh;
    user-select: none;
  }

  /* ── Prototype watermark ── */
  body::before {
    content: "PROTOTYPE — throwaway, not production";
    position: fixed;
    top: 4px;
    right: 12px;
    font-size: 10px;
    color: var(--red);
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.7;
    z-index: 999;
  }

  /* ── Simulated Waybar ── */
  .waybar {
    width: calc(100% - 24px);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    padding: 0;
    margin: 5px 12px 0 12px;
  }

  .modules-left,
  .modules-center,
  .modules-right {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .modules-center { flex: 1; }

  /* ── Workspace buttons ── */
  .ws-btn {
    background: var(--surface);
    border: none;
    border-radius: 0;
    color: var(--silver);
    padding: 4px 12px;
    margin: 0 2px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: default;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .ws-btn.active {
    background: var(--red);
    color: var(--bg);
    box-shadow: 0 0 12px rgba(255,45,85,0.4);
  }
  .ws-btn.urgent {
    color: var(--orange);
    animation: blink-orange 1s steps(12) infinite alternate;
  }
  .ws-btn.empty {
    color: var(--muted);
  }
  @keyframes blink-orange {
    to { color: var(--silver); }
  }

  /* ── Pill modules (shared) ── */
  .pill {
    border: none;
    border-radius: 0;
    padding: 4px 14px;
    margin: 0 0.25px;
    font-weight: 600;
    font-family: inherit;
    cursor: default;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 1px 0 3px rgba(0,0,0,0.4);
    transition: margin-top 0.15s ease, margin-bottom 0.15s ease;
  }
  .pill:hover {
    margin-top: 1px;
    margin-bottom: -1px;
  }

  /* ── System group (gapless, dark bg, colored text) ── */
  .pill.system {
    background: var(--surface);
    margin: 0;
    box-shadow: none;
  }
  .pill.system.disk  { color: var(--lime); }
  .pill.system.mem   { color: var(--orange); }
  .pill.system.temp  { color: var(--cyan); }

  /* ── Personal UI group (colored bg, dark text) ── */
  .pill.personal {
    color: var(--bg);
  }
  .pill.personal.audio   { background: var(--orange); }
  .pill.personal.clock   { background: var(--cyan); }
  .pill.personal.battery { background: var(--lime); }

  /* ── Separator ── */
  .sep {
    background: var(--border);
    min-width: 1px;
    min-height: 14px;
    margin: 0 6px;
    border-radius: 0;
  }

  /* ── Power button ── */
  .pill.power-btn {
    background: linear-gradient(180deg, var(--red), rgba(255,45,85,0.85));
    color: var(--bg);
    font-size: 20px;
    font-weight: 700;
    padding: 0 14px;
  }

  /* ── Tray placeholder ── */
  .tray-placeholder {
    color: var(--muted);
    padding: 4px 8px;
    font-size: 11px;
  }

  /* ══════════════════════════════════════════════════════════════
     MPD PILL — THE THING BEING PROTOTYPED
     ══════════════════════════════════════════════════════════════ */
  #mpd-pill {
    border: none;
    border-radius: 0;
    padding: 4px 14px;
    margin: 0 0 0 4px;  /* slight gap after workspaces */
    font-weight: 600;
    font-family: inherit;
    font-size: 13px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: default;
    box-shadow: 1px 0 3px rgba(0,0,0,0.4);
    transition: background 0.2s ease, margin-top 0.15s ease, margin-bottom 0.15s ease;
  }
  #mpd-pill:hover {
    margin-top: 1px;
    margin-bottom: -1px;
  }
  #mpd-pill .mpd-icon {
    font-size: 14px;
  }
  #mpd-pill .mpd-text {
    font-size: 13px;
  }

  /* State variants: idle gets muted treatment */
  #mpd-pill.state-idle {
    background: var(--surface);
    color: var(--muted);
    box-shadow: none;
  }

  /* ══════════════════════════════════════════════════════════════
     CONTROL PANEL
     ══════════════════════════════════════════════════════════════ */
  .controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
    justify-content: center;
    z-index: 100;
    font-size: 12px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .control-group .options {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }
  .control-group button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--silver);
    padding: 4px 10px;
    border-radius: 0;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
  }
  .control-group button:hover {
    background: #1e1e28;
  }
  .control-group button.active {
    background: var(--red);
    border-color: var(--red);
    color: var(--bg);
  }

  /* ── State display (read-only) ── */
  .state-display {
    margin-top: 40px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    max-width: 600px;
    width: 100%;
    font-size: 12px;
    line-height: 1.6;
    display: none; /* hidden by default, toggle with checkbox */
  }

  /* ── Key hint ── */
  .key-hint {
    margin-top: 16px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
  }
  .key-hint span {
    color: var(--silver);
    font-weight: 700;
  }

  /* Variant label in MPD pill area */
  .variant-marker {
    position: absolute;
    font-size: 9px;
    color: var(--muted);
    pointer-events: none;
  }

  /* Responsive: stack controls on narrow screens */
  @media (max-width: 900px) {
    .controls { gap: 10px; padding: 8px 12px; }
    .control-group button { padding: 3px 7px; font-size: 10px; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     SIMULATED WAYBAR
     ══════════════════════════════════════════════════════════════ -->
<div class="waybar" id="waybar">

  <!-- LEFT: workspaces + MPD pill -->
  <div class="modules-left" id="modules-left">
    <!-- Workspaces 1-9 -->
    <span class="ws-btn active">1</span>
    <span class="ws-btn empty">2</span>
    <span class="ws-btn empty">3</span>
    <span class="ws-btn empty">4</span>
    <span class="ws-btn empty">5</span>
    <span class="ws-btn empty">6</span>
    <span class="ws-btn empty">7</span>
    <span class="ws-btn empty">8</span>
    <span class="ws-btn empty">9</span>

    <!-- ★ MPD PILL — prototype target ★ -->
    <span id="mpd-pill" class="pill personal state-playing"
          title="Polyphia — Playing God&#10;Remember That You Will Die&#10;MPD via mpd-mpris">
      <span class="mpd-icon"></span>
      <span class="mpd-text">Artist — Title</span>
    </span>
  </div>

  <!-- CENTER: empty (design decision) -->
  <div class="modules-center"></div>

  <!-- RIGHT: system + personal + utilities -->
  <div class="modules-right" id="modules-right">
    <!-- Group 1: System (gapless) -->
    <span class="pill system disk">/ 81% FREE</span>
    <span class="pill system mem"> 6.4G / 16G</span>
    <span class="pill system temp"> 52°C</span>

    <!-- Separator 1 -->
    <span class="sep"></span>

    <!-- Group 2: Personal UI -->
    <span class="pill personal audio"> 42%</span>
    <span class="pill personal clock"> Mon 11  14:32</span>
    <span class="pill personal battery"> 87%</span>

    <!-- Separator 2 -->
    <span class="sep"></span>

    <!-- Group 3: Utilities -->
    <span class="tray-placeholder">[tray]</span>
    <span class="pill power-btn">⏻</span>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     CONTROL PANEL
     ══════════════════════════════════════════════════════════════ -->
<div class="controls" id="controls">

  <!-- State toggle -->
  <div class="control-group">
    <label>Playback State</label>
    <div class="options" id="state-btns">
      <button data-state="playing" class="active">▶ Playing</button>
      <button data-state="paused">⏸ Paused</button>
      <button data-state="idle">⏹ Idle (nothing)</button>
    </div>
  </div>

  <!-- Accent color -->
  <div class="control-group">
    <label>Accent Color</label>
    <div class="options" id="color-btns">
      <button data-color="#ff2d55" class="active">Red</button>
      <button data-color="#00e5ff">Cyan</button>
      <button data-color="#c8ff00">Lime</button>
      <button data-color="#ff6b00">Orange</button>
    </div>
  </div>

  <!-- Format string -->
  <div class="control-group">
    <label>Format String</label>
    <div class="options" id="format-btns">
      <button data-format="dynamic" class="active">● {dynamic}</button>
      <button data-format="artist-title">{artist} - {title}</button>
      <button data-format="icon-full"> {artist} — {title}</button>
    </div>
  </div>

  <!-- Placeholder text (idle state) -->
  <div class="control-group">
    <label>Placeholder</label>
    <div class="options" id="placeholder-btns">
      <button data-placeholder="dash">—</button>
      <button data-placeholder="nothing" class="active">Nothing playing</button>
      <button data-placeholder="stopped">Stopped</button>
    </div>
  </div>

  <!-- Status icon behavior -->
  <div class="control-group">
    <label>Status Icon</label>
    <div class="options" id="icon-btns">
      <button data-icon="fixed">Fixed </button>
      <button data-icon="dynamic" class="active">Dynamic (play/pause)</button>
    </div>
  </div>

</div>

<!-- Info line -->
<div class="key-hint" style="margin-top: 16px; margin-bottom: 120px;">
  <span>↑ Click controls above</span> to test combinations &nbsp;|&nbsp;
  Watch the <span>MPD pill</span> in the bar update live &nbsp;|&nbsp;
  Colors and styles match the <span>CGGX Waybar</span> exactly
</div>


<!-- ══════════════════════════════════════════════════════════════
     SCRIPT — pure logic, no framework
     ══════════════════════════════════════════════════════════════ -->
<script>
  // ── State (defaults = locked-in design decisions) ─────
  const state = {
    playback: 'playing',       // 'playing' | 'paused' | 'idle'
    accent:   '#ff2d55',       // RED — chosen accent
    format:   'dynamic',       // {dynamic} — chosen format
    placeholder: 'nothing',    // "Nothing playing" — chosen placeholder
    iconMode: 'dynamic',       // dynamic — chosen icon behavior
  };

  // Sample track data (simulates MPRIS metadata for a playing track)
  const track = {
    artist: 'Polyphia',
    title:  'Playing God',
    album:  'Remember That You Will Die',
  };

  // ── Derived values (pure) ──────────────────────────────
  const PLACEHOLDER_MAP = {
    dash:    '—',
    nothing: 'Nothing playing',
    stopped: 'Stopped',
  };

  const ICON_MAP = {
    playing: '',   // nf-fa-music (U+F001)
    paused:  '',   // nf-fa-pause  (U+F04C)
    idle:    '',   // same as playing but muted
  };

  function resolveIcon() {
    if (state.iconMode === 'fixed') return '';
    return ICON_MAP[state.playback];
  }

  function resolveFormat() {
    if (state.playback === 'idle') {
      return PLACEHOLDER_MAP[state.placeholder];
    }

    switch (state.format) {
      case 'dynamic':
        // Waybar's {dynamic} auto-composes: "Artist - Title"
        // Falls back gracefully if one is missing
        if (track.artist && track.title) return track.artist + ' - ' + track.title;
        if (track.title) return track.title;
        if (track.artist) return track.artist;
        return 'Unknown';

      case 'artist-title':
        // Explicit {artist} - {title}
        if (track.artist && track.title) return track.artist + ' - ' + track.title;
        if (track.title) return track.title;
        if (track.artist) return track.artist;
        return 'Unknown';

      case 'icon-full':
        //  {artist} — {title}   (icon in format string itself)
        // NOTE: when format=icon-full, the separate icon element hides
        if (track.artist && track.title) return track.artist + ' \u2014 ' + track.title;
        if (track.title) return track.title;
        if (track.artist) return track.artist;
        return 'Unknown';

      default:
        return track.artist + ' - ' + track.title;
    }
  }

  function showIconSeparate() {
    // When format includes the icon (icon-full), hide the separate icon span
    return state.format !== 'icon-full';
  }

  // ── Render ─────────────────────────────────────────────
  const mpdPill  = document.getElementById('mpd-pill');
  const iconEl   = mpdPill.querySelector('.mpd-icon');
  const textEl   = mpdPill.querySelector('.mpd-text');

  function render() {
    // 1. Update class for idle vs active styling
    mpdPill.className = 'pill personal';
    if (state.playback === 'idle') {
      mpdPill.classList.add('state-idle');
    } else {
      mpdPill.classList.add('state-' + state.playback);
    }

    // 2. Apply accent color background (idle uses surface bg)
    if (state.playback !== 'idle') {
      mpdPill.style.background = state.accent;
      mpdPill.style.color = 'var(--bg)';
    } else {
      mpdPill.style.background = '';  // CSS handles idle
      mpdPill.style.color = '';
    }

    // 3. Icon
    iconEl.textContent = resolveIcon();
    iconEl.style.display = showIconSeparate() ? '' : 'none';

    // 4. Text
    textEl.textContent = resolveFormat();

    // 5. Tooltip (simulates Waybar tooltip-format)
    if (state.playback !== 'idle') {
      mpdPill.title = track.artist + ' \u2014 ' + track.title
        + '\n' + track.album
        + '\nMPD via mpd-mpris';
    } else {
      mpdPill.title = 'No music playing';
    }
  }

  // ── Control wiring ─────────────────────────────────────
  function setActiveInGroup(containerId, activeBtn) {
    const container = document.getElementById(containerId);
    container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    activeBtn.classList.add('active');
  }

  // State buttons
  document.getElementById('state-btns').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    state.playback = e.target.dataset.state;
    setActiveInGroup('state-btns', e.target);
    render();
  });

  // Color buttons
  document.getElementById('color-btns').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    state.accent = e.target.dataset.color;
    setActiveInGroup('color-btns', e.target);
    render();
  });

  // Format buttons
  document.getElementById('format-btns').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    state.format = e.target.dataset.format;
    setActiveInGroup('format-btns', e.target);
    render();
  });

  // Placeholder buttons
  document.getElementById('placeholder-btns').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    state.placeholder = e.target.dataset.placeholder;
    setActiveInGroup('placeholder-btns', e.target);
    render();
  });

  // Icon mode buttons
  document.getElementById('icon-btns').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    state.iconMode = e.target.dataset.icon;
    setActiveInGroup('icon-btns', e.target);
    render();
  });

  // ── Keyboard shortcuts ─────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Don't intercept when typing in inputs
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
      case '1': state.playback = 'playing';  syncUI(); render(); break;
      case '2': state.playback = 'paused';   syncUI(); render(); break;
      case '3': state.playback = 'idle';     syncUI(); render(); break;
      case 'r': case 'R': state.accent = '#ff2d55';  syncUI(); render(); break;
      case 'c': case 'C': state.accent = '#00e5ff';  syncUI(); render(); break;
      case 'l': case 'L': state.accent = '#c8ff00';  syncUI(); render(); break;
      case 'o': case 'O': state.accent = '#ff6b00';  syncUI(); render(); break;
      case 'd': case 'D': state.format = 'dynamic';       syncUI(); render(); break;
      case 'a': case 'A': state.format = 'artist-title';  syncUI(); render(); break;
      case 'i': case 'I': state.format = 'icon-full';     syncUI(); render(); break;
      case 'p': state.iconMode = state.iconMode === 'fixed' ? 'dynamic' : 'fixed'; syncUI(); render(); break;
    }
  });

  function syncUI() {
    // Reflect state back onto button active states
    document.querySelectorAll('#state-btns button').forEach(b => {
      b.classList.toggle('active', b.dataset.state === state.playback);
    });
    document.querySelectorAll('#color-btns button').forEach(b => {
      b.classList.toggle('active', b.dataset.color === state.accent);
    });
    document.querySelectorAll('#format-btns button').forEach(b => {
      b.classList.toggle('active', b.dataset.format === state.format);
    });
    document.querySelectorAll('#placeholder-btns button').forEach(b => {
      b.classList.toggle('active', b.dataset.placeholder === state.placeholder);
    });
    document.querySelectorAll('#icon-btns button').forEach(b => {
      b.classList.toggle('active', b.dataset.icon === state.iconMode);
    });
  }

  // ── Initial render ─────────────────────────────────────
  render();

  // ── Log state on load ──────────────────────────────────
  console.log('%cMPD Pill Prototype — CGGX Waybar%c',
    'font-weight:bold;font-size:14px;color:#ff2d55', '');
  console.log('Controls at bottom. Keyboard shortcuts:');
  console.log('  1/2/3 = playing/paused/idle');
  console.log('  R/C/L/O = Red/Cyan/Lime/Orange accent');
  console.log('  D/A/I   = Dynamic/Artist-Title/Icon-Full format');
  console.log('  P       = toggle fixed/dynamic icon');
  console.log('Current state:', JSON.stringify(state, null, 2));
</script>

</body>
</html>
