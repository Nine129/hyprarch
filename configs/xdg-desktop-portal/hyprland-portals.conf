# ── CGGX XDG Desktop Portal ─────────────────────────────
# Place at: ~/.config/xdg-desktop-portal/hyprland-portals.conf
#
# Portals provide a consistent file picker, screen sharing,
# and global app settings across Flatpak / native apps.
# Hyprland's portal implementation replaces GNOME/KDE portals.
#
# Packages needed:
#   xdg-desktop-portal-hyprland
#   xdg-desktop-portal-gtk   (GTK fallback for file picker)

[preferred]
# Hyprland portal takes all available roles
default = hyprland

# GTK fallback for file chooser (looks and feels native)
filechooser = gtk

# Screen capture / screencast via xdg-desktop-portal-wlr or hyprland
screencast = hyprland
screenrecording = hyprland

# Global settings
settings = hyprland

            