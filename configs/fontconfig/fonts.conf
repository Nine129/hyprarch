<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ── CGGX Fontconfig ─────────────────────────────────
     Place at: ~/.config/fontconfig/fonts.conf
     Consistent hinting, anti-aliasing, and font fallback
     across GTK, Qt, and terminal apps.
     Reload: fc-cache -fv
  ──────────────────────────────────────────────────────── -->

<fontconfig>

  <!-- ── Anti-aliasing & hinting ──────────────────────
       Full RGB subpixel rendering (LCD screens).
       Slight hinting for crisp text without distortion. -->
  <match target="font">
    <edit name="antialias"     mode="assign"><bool>true</bool></edit>
    <edit name="hinting"       mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"     mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"          mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"     mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- ── Prefer JetBrains Mono as monospace ─────────── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono Nerd Font</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- ── Sans-serif: Rajdhani + Exo 2 for UI ────────── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Rajdhani</family>
      <family>Exo 2</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- ── Serif fallback ─────────────────────────────── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- ── Monospace size override for TUI apps ─────────
       Force 10px in terminal contexts for consistent
       waybar/btop/kitty alignment. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrains Mono</string>
    </test>
    <test name="pixelsize" compare="less_eq">
      <double>9</double>
    </test>
    <edit name="pixelsize" mode="assign">
      <double>10</double>
    </edit>
  </match>

  <!-- ── CJK / Emoji fallback ─────────────────────────
       For Chinese, Japanese, Korean chars + emoji. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Sans CJK JP</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <!-- ── Disable bitmaps (use outlines) ─────────────── -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- ── Rescan interval (check for new fonts every 30s) -->
  <config>
    <rescan>
      <int>30</int>
    </rescan>
  </config>

</fontconfig>

            