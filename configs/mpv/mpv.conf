# Minimal mpv.conf — UI is drawn by ModernZ OSC
osc=no
keep-open=yes
hwdec=vaapi
osd-font=Inter

# Required by ModernZ: prevents subtitle/OSD offset glitches when
# watch-later resumes a file with saved sub-pos / osd-margin-y
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y
