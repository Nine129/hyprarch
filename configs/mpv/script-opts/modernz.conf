# ── ModernZ overrides — clean neutral ─────────────────────────────
# Palette matches the active desktop theme (waybar colors/cggx.css):
#   bg #0a0a0c · surface #151518 · border #2a2a35
#   silver #e8e8f0 (fg) · muted #6a6a80
# Unset options fall back to ModernZ defaults.

# Layout & display
layout=default
icon_theme=fluent
icon_style=mixed
font=Inter
hide_empty_playlist_button=yes

# Behaviour
hidetimeout=1500
fadeduration=200
fadein=yes
keeponpause=bottombar
osc_on_start=no
deadzone_hide=instant
mouse_seek_pause=yes

# Buttons — keep the bar uncluttered
jump_buttons=no
chapter_skip_buttons=no
info_button=no
ontop_button=no
download_button=no
playlist_button=yes
track_nextprev_buttons=yes
volume_control=yes
fullscreen_button=yes
screenshot_button=yes
loop_button=yes
speed_button=yes

# Colors — neutral ramp, play button brightest
osc_color=#000000
title_color=#e8e8f0
time_color=#6a6a80
chapter_title_color=#b0b0c0
window_title_color=#e8e8f0

seekbarfg_color=#e8e8f0
seekbarbg_color=#2a2a35
seekbar_cache_color=#4a4a58
seek_handle_color=#e8e8f0
seek_handle_border_color=#0a0a0c
volumebar_match_seek_color=yes

playpause_color=#ffffff
middle_buttons_color=#d4d4de
side_buttons_color=#b4b4c4
held_element_color=#8f8fa2
hover_effect_color=#ffffff

nibble_color=#4a4a58
nibble_current_color=#e8e8f0
ab_loop_color=#6a6a80

# Interaction
hover_effect=size,color    # no glow/box — flat and clean
button_hover_size=115
tooltip_hints=yes

# Thumbnail box (thumbfast)
thumbnail_box_color=#151518
thumbnail_box_outline=#2a2a35
thumbnail_box_outline_size=1
thumbnail_box_radius=8
thumbnail_box_padding=4.5

# Seekbar
seekbar_height=medium
slider_rounded_corners=yes
seek_handle_size=0.8
seekrange=yes
