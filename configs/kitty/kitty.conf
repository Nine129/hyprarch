# ── CGGX Kitty ─────────────────────────────────────────
# Terminal emulator for Hyprland
#
# Drop-in config — place at ~/.config/kitty/kitty.conf

# ── Font ───────────────────────────────────────────────
font_family MonaspiceNe Nerd Font
bold_font  auto
italic_font  auto
bold_italic_font  auto
font_size  9.3
font_features  none
adjust_line_height  0
adjust_column_width 0
disable_ligatures  never

# ── Layout ─────────────────────────────────────────────
window_padding_width  0
hide_window_decorations  yes
remember_window_size  no
initial_window_width  980
initial_window_height  600

# ── Tab bar ────────────────────────────────────────────
tab_bar_style  separator
tab_bar_edge  bottom
tab_bar_margin_width  0.0
tab_bar_margin_height  0.0 0.0
tab_separator  "  ┊  "
active_tab_foreground  #e8e8f0
active_tab_background  #1a1a20
inactive_tab_foreground #6a6a80
inactive_tab_background #151518
tab_bar_background  #151518

# ── Bell ───────────────────────────────────────────────
bell_on_tab  yes
visual_bell_duration  0.0
enable_audio_bell  no

# ── Scrolling ──────────────────────────────────────────
scrollback_lines  10000
scrollback_pager_history_size 0
scrollback_fill_enlarged_window yes

# ── Mouse ──────────────────────────────────────────────
mouse_hide_wait  0.0
url_color  #00e5ff
url_style  curly
open_url_with  default
copy_on_select  no
click_interval  0.5
focus_follows_mouse  no

# ── Cursor ─────────────────────────────────────────────
cursor  #e8e8f0
cursor_shape  block
cursor_blink_interval  0.5
cursor_stop_blinking_after 5.0

# ── Shell integration ──────────────────────────────────
allow_remote_control  yes
shell_integration  enabled
close_on_child_death  no
confirm_os_window_close 0

# ── Performance ────────────────────────────────────────
input_delay  3
sync_to_monitor  no

# ── CGGX Color Palette ────────────────────────────────
# Background / Foreground
background_opacity  0.94
background  #151518
foreground  #e8e8f0

# ── Basic 16 colors ───────────────────────────────────
# black / dark gray
color0  #151518
color8  #2a2a35

# red
color1  #ff2d55
color9  #ff2d55

# green / lime
color2  #C8FF00
color10 #C8FF00

# yellow / orange
color3  #ff6b00
color11 #ff6b00

# blue / cyan
color4  #00e5ff
color12 #00e5ff

# magenta
color5  #b48cff
color13 #b48cff

# cyan
color6  #00e5ff
color14 #00e5ff

# white / silver
color7  #e8e8f0
color15 #e8e8f0

# ── Extended colors ───────────────────────────────────
# Selection
selection_foreground  #151518
selection_background  #ff2d55

# ── Keybinds ──────────────────────────────────────────
# Ctrl+Shift+arrows: navigate splits
map  ctrl+shift+left    neighboring_window left
map  ctrl+shift+right   neighboring_window right
map  ctrl+shift+up      neighboring_window up
map  ctrl+shift+down    neighboring_window down

# Ctrl+Shift+Enter: new window (split)
map  ctrl+shift+enter   new_window

# Ctrl+Shift+Tab: next layout
map  ctrl+shift+tab     next_layout

# Ctrl+Shift+W: close window
map  ctrl+shift+w       close_window

# Ctrl+Shift+Z: toggle fullscreen
map  ctrl+shift+z       toggle_fullscreen

# Ctrl+Shift+N: new tab
map  ctrl+shift+n       new_tab

# Ctrl+Shift+Q: close tab
map  ctrl+shift+q       close_tab

# Ctrl+Shift+1-9: switch tab
map  ctrl+shift+1       goto_tab 1
map  ctrl+shift+2       goto_tab 2
map  ctrl+shift+3       goto_tab 3
map  ctrl+shift+4       goto_tab 4
map  ctrl+shift+5       goto_tab 5
map  ctrl+shift+6       goto_tab 6
map  ctrl+shift+7       goto_tab 7
map  ctrl+shift+8       goto_tab 8
map  ctrl+shift+9       goto_tab 9

# Ctrl+Shift+F: open font size
map  ctrl+shift+f       toggle_layout stacks

# Ctrl+Shift+R: reload config
map  ctrl+shift+r       load_config_file

# ── Clipboard ─────────────────────────────────────────
clipboard_control  write-clipboard write-primary
listen_on unix:/tmp/kitty-socket

include rainbow-trail.conf
