<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Popout — Clean Prototype</title>
<style>
  @font-face {
    font-family: 'JetBrainsMono Nerd Font';
    src: local('JetBrainsMono Nerd Font'),
         local('JetBrainsMono Nerd Font Regular');
    font-weight: 400;
  }
  @font-face {
    font-family: 'JetBrainsMono Nerd Font';
    src: local('JetBrainsMono Nerd Font Bold'),
         local('JetBrainsMono Nerd Font Bold');
    font-weight: 700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'JetBrainsMono Nerd Font', 'JetBrains Mono', monospace;
  }

  .panel {
    width: 303px;
    background: #151518;
    border: 1px solid #2a2a35;
    padding: 20px 18px 28px;
    position: relative;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .header-label {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ff6b00;
  }
  .header-pct {
    font-size: 28px;
    font-weight: 700;
    color: #e8e8f0;
  }
  .header-pct.muted { color: #ff2d55; }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .mute-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: #e8e8f0;
    flex-shrink: 0;
    border-radius: 2px;
    transition: background 0.1s;
  }
  .mute-btn:hover { background: rgba(255,107,0,0.10); }
  .mute-btn.muted { color: #ff2d55; }
  .mute-btn.muted:hover { background: rgba(255,45,85,0.10); }

  .track-wrap {
    flex: 1; height: 28px;
    display: flex; align-items: center;
    cursor: pointer;
    position: relative;
  }
  .track {
    width: 100%; height: 6px;
    background: #1a1a20;
    position: relative;
  }
  .fill {
    height: 100%;
    background: #ff6b00;
    transition: width 0.08s;
  }
  .thumb {
    position: absolute;
    top: 50%;
    width: 18px; height: 18px;
    background: #ff6b00;
    border: 2px solid #151518;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .step-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 20px;
    color: #e8e8f0;
    flex-shrink: 0;
    user-select: none;
    transition: all 0.1s;
  }
  .step-btn:hover {
    color: #e8e8f0;
    background: rgba(255,107,0,0.08);
  }

  .device {
    display: flex; align-items: center;
    gap: 8px;
    padding: 14px 0;
    cursor: pointer;
    margin-top: 10px;
    border-top: 1px solid #2a2a35;
  }
  .device-icon { font-size: 14px; color: #ff6b00; }
  .device-name {
    flex: 1;
    font-size: 11px; font-weight: 700;
    color: #6a6a80;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color 0.1s;
  }
  .device:hover .device-name { color: #e8e8f0; }
  .device-arrow {
    font-size: 10px; color: #6a6a80;
    transition: transform 0.15s;
  }
  .device-arrow.open { transform: rotate(180deg); }

  .dropdown { display: none; margin-top: 2px; }
  .dropdown.open { display: block; }
  .dropdown-item {
    display: flex; align-items: center;
    gap: 6px;
    padding: 6px 8px;
    font-size: 11px; font-weight: 700;
    color: #6a6a80;
    cursor: pointer;
    transition: all 0.1s;
  }
  .dropdown-item:hover {
    color: #e8e8f0;
    background: rgba(255,107,0,0.06);
  }
  .dropdown-item.active { color: #ff6b00; }
  .dropdown-item .dot { font-size: 9px; }
  .dropdown-item.active .dot { color: #ff6b00; }
  .dropdown-item .dot { color: #6a6a80; }

  .streams-header {
    font-size: 10px; font-weight: 700;
    letter-spacing: 2px;
    color: #ff6b00;
    margin-top: 18px;
    margin-bottom: 10px;
  }

  .stream {
    display: flex; flex-direction: column;
    gap: 12px;
    padding: 12px 0;
  }
  .stream + .stream { border-top: 1px solid #1f1f28; }

  .stream-top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .stream-name {
    font-size: 11px; font-weight: 700;
    color: #e8e8f0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .stream-name.muted { color: #ff2d55; }
  .stream-pct {
    font-size: 10px; font-weight: 700;
    color: #6a6a80;
    margin-left: 8px; flex-shrink: 0;
  }
  .stream-pct.muted { color: #ff2d55; }

  .stream-track {
    width: 100%; height: 3px;
    background: #1a1a20;
    position: relative;
    cursor: pointer;
  }
  .stream-fill {
    height: 100%;
    background: #ff6b00;
    transition: width 0.08s;
  }
  .stream-fill.muted { background: rgba(255,45,85,0.5); }
  .stream-thumb {
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    background: #ff6b00;
    border: 2px solid #151518;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .empty {
    font-size: 10px; color: #6a6a80;
    text-align: center; padding: 8px 0;
  }
</style>
</head>
<body>

<div class="panel">

  <div class="header">
    <span class="header-label">VOLUME</span>
    <span class="header-pct" id="pctDisplay">42%</span>
  </div>

  <div class="slider-row">
    <div class="mute-btn" id="muteBtn" onclick="toggleMute()">󰕾</div>

    <div class="track-wrap" id="trackWrap" onclick="seekSlider(event)">
      <div class="track">
        <div class="fill" id="sliderFill" style="width:42%"></div>
      </div>
      <div class="thumb" id="sliderThumb" style="left:42%"></div>
    </div>

    <div class="step-btn" onclick="stepVol(-5)">−</div>
    <div class="step-btn" onclick="stepVol(5)">+</div>
  </div>

  <div class="device">
    <span class="device-icon">󰓃</span>
    <span class="device-name">Built-in Audio Analog Stereo</span>
    <span class="device-arrow" id="devArrow">▾</span>
  </div>

  <div class="dropdown" id="dropdown">
    <div class="dropdown-item active"><span class="dot">●</span> Built-in Audio Analog Stereo</div>
    <div class="dropdown-item"><span class="dot">○</span> USB-C Headset</div>
    <div class="dropdown-item"><span class="dot">○</span> Bluetooth Speakers</div>
  </div>

  <div class="streams-header">PLAYBACK</div>

  <div class="stream">
    <div class="stream-top">
      <span class="stream-name">Firefox</span>
      <span class="stream-pct">34%</span>
    </div>
    <div class="stream-track">
      <div class="stream-fill" style="width:34%"></div>
      <div class="stream-thumb" style="left:34%"></div>
    </div>
  </div>

  <div class="stream">
    <div class="stream-top">
      <span class="stream-name">Spotify</span>
      <span class="stream-pct">56%</span>
    </div>
    <div class="stream-track">
      <div class="stream-fill" style="width:56%"></div>
      <div class="stream-thumb" style="left:56%"></div>
    </div>
  </div>

  <div class="stream">
    <div class="stream-top">
      <span class="stream-name muted">Discord</span>
      <span class="stream-pct muted">—</span>
    </div>
    <div class="stream-track">
      <div class="stream-fill muted" style="width:0%"></div>
      <div class="stream-thumb" style="left:0%"></div>
    </div>
  </div>

</div>

<script>
  let muted = false;
  let vol = 42;

  function updateUI() {
    document.getElementById('pctDisplay').textContent = muted ? '—' : Math.round(vol) + '%';
    document.getElementById('pctDisplay').className = 'header-pct' + (muted ? ' muted' : '');
    document.getElementById('sliderFill').style.width = muted ? '0%' : vol + '%';
    document.getElementById('sliderThumb').style.left = muted ? '0%' : vol + '%';
    document.getElementById('muteBtn').textContent = muted ? '󰝟' : '󰕾';
    document.getElementById('muteBtn').className = 'mute-btn' + (muted ? ' muted' : '');
  }

  function toggleMute() { muted = !muted; updateUI(); }

  function seekSlider(e) {
    const rect = document.getElementById('trackWrap').getBoundingClientRect();
    const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
    if (!muted) vol = pct;
    updateUI();
  }

  function stepVol(delta) {
    if (muted) return;
    vol = Math.max(0, Math.min(100, vol + delta));
    updateUI();
  }
</script>

</body>
</html>
