<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wlogout — row of 5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0c;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Share Tech Mono', monospace;
  overflow: hidden;
}

.wlogout {
  position: relative;
  background: rgba(10, 10, 12, 0.82);
  overflow: hidden;
}

.splats {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.splat {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.07;
}
.splat-1 { width: 380px; height: 380px; background: #ff2d55; top: -100px; left: -60px; }
.splat-2 { width: 300px; height: 300px; background: #00e5ff; bottom: -80px; right: -40px; }
.splat-3 { width: 240px; height: 240px; background: #c8ff00; top: 50%; left: 55%; transform: translate(-50%, -50%); }
.splat-4 { width: 280px; height: 280px; background: #ff6b00; bottom: 10%; left: -80px; }

.grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  padding: 120px 100px;
}

.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 24px 14px;
  border: 1px solid;
  background-color: rgba(255, 255, 255, 0.06);
  color: #e8e8f0;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
}

.btn .icon {
  font-size: 24px;
  line-height: 1;
}

.btn-lock {
  background-color: rgba(90, 170, 0, 0.35);
  border-color: rgba(200, 255, 0, 0.55);
  color: #c8ff00;
}
.btn-lock:hover {
  background-color: rgba(90, 170, 0, 0.50);
  border-color: rgba(200, 255, 0, 0.80);
}

.btn-suspend {
  background-color: rgba(120, 0, 180, 0.35);
  border-color: rgba(189, 0, 255, 0.55);
  color: #bd00ff;
}
.btn-suspend:hover {
  background-color: rgba(120, 0, 180, 0.50);
  border-color: rgba(189, 0, 255, 0.80);
}

.btn-logout {
  background-color: rgba(170, 65, 0, 0.35);
  border-color: rgba(255, 107, 0, 0.55);
  color: #ff6b00;
}
.btn-logout:hover {
  background-color: rgba(170, 65, 0, 0.50);
  border-color: rgba(255, 107, 0, 0.80);
}

.btn-reboot {
  background-color: rgba(0, 150, 180, 0.35);
  border-color: rgba(0, 229, 255, 0.55);
  color: #00e5ff;
}
.btn-reboot:hover {
  background-color: rgba(0, 150, 180, 0.50);
  border-color: rgba(0, 229, 255, 0.80);
}

.btn-shutdown {
  background-color: rgba(170, 15, 40, 0.38);
  border-color: rgba(255, 45, 85, 0.55);
  color: #ff2d55;
}
.btn-shutdown:hover {
  background-color: rgba(170, 15, 40, 0.55);
  border-color: rgba(255, 45, 85, 0.80);
}

.palette {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  align-items: center;
  background: rgba(10,10,12,0.7);
  padding: 10px 18px;
  border: 1px solid #2a2a35;
  z-index: 10;
}
.swatch {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: #6a6a80;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.dot {
  width: 12px; height: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}
</style>
</head>
<body>

<div class="wlogout">
  <div class="splats">
    <div class="splat splat-1"></div>
    <div class="splat splat-2"></div>
    <div class="splat splat-3"></div>
    <div class="splat splat-4"></div>
  </div>

  <div class="grid">
    <div class="btn btn-lock">
      <span class="icon"></span>
      LOCK
    </div>
    <div class="btn btn-suspend">
      <span class="icon">󰤄</span>
      SUSPEND
    </div>
    <div class="btn btn-logout">
      <span class="icon">󰗽</span>
      LOG OUT
    </div>
    <div class="btn btn-reboot">
      <span class="icon"></span>
      REBOOT
    </div>
    <div class="btn btn-shutdown">
      <span class="icon">⏻</span>
      SHUTDOWN
    </div>
  </div>
</div>

<div class="palette">
  <div class="swatch"><span class="dot" style="background:#c8ff00"></span>lime</div>
  <div class="swatch"><span class="dot" style="background:#bd00ff"></span>purple</div>
  <div class="swatch"><span class="dot" style="background:#ff6b00"></span>orange</div>
  <div class="swatch"><span class="dot" style="background:#00e5ff"></span>cyan</div>
  <div class="swatch"><span class="dot" style="background:#ff2d55"></span>red</div>
</div>

</body>
</html>
